<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TennisBet Pro - Scores ESPN en Direct</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TennisBet">
    
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=TEN&background=84cc16&color=fff&size=512&font-size=0.4&v=2">
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=TEN&background=84cc16&color=fff&size=512&font-size=0.4&v=2">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-lime-400 flex items-center">
                <i class="fa-solid fa-trophy mr-2"></i>TennisBet Pro
            </h1>
            <div class="flex items-center space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-lime-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-lime-400" onchange="loadTennisMatches()">
                <button onclick="toggleHistoryStats()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 font-bold transition flex items-center shadow relative">
                    <i class="fa-solid fa-calendar-days"></i>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-fire mr-1.5"></i> En Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-lime-400 flex-grow">
                <option value="ALL">Tous les tournois</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-lime-400 font-mono flex items-center w-3/4 truncate">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement (connexion directe sans proxy)...
            </div>
            <button onclick="loadTennisMatches(false)" class="bg-zinc-800 hover:bg-zinc-700 text-lime-400 px-3 py-1.5 rounded-lg border border-lime-500/30 text-xs font-bold transition flex items-center shadow">
                <i class="fa-solid fa-rotate mr-1.5"></i> Actualiser
            </button>
        </div>

        <div id="historyBlock" class="hidden bg-zinc-900 border border-lime-500/30 rounded-2xl p-4 shadow-xl mb-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase text-zinc-300 tracking-wider flex items-center">
                    <i class="fa-solid fa-vault mr-1.5 text-lime-400"></i> Vos Gains Cumulés
                </h2>
                <button onclick="toggleHistoryStats()" class="text-zinc-500 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Semaine en cours</h3>
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-zinc-400">Bénéfice Net :</span>
                        <span id="weekProfit" class="text-lime-400">-- €</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-lime-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-lime-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-zinc-400 uppercase">Matchs pariés</div>
                <div id="dailyBetsCount" class="text-sm font-bold text-zinc-300">0</div>
            </div>
        </div>

        <div id="matchesContainer" class="space-y-3">
            <!-- Les matchs s'afficheront ici -->
        </div>

    </main>

    <script>
        document.getElementById('matchDate').valueAsDate = new Date();
        let currentMatches = [];
        let isLiveFilterActive = false;

        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02; 

        // Actualisation toutes les 30s
        setInterval(() => {
            let today = new Date().toISOString().split('T')[0];
            let selectedDate = document.getElementById('matchDate').value;
            if (selectedDate === today || isLiveFilterActive) {
                loadTennisMatches(true);
            }
        }, 30000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-lime-900/90 border-lime-500/50 text-lime-200' : 'bg-zinc-800 border-zinc-700 text-white';
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadTennisMatches(isSilent = false) {
            const dateStr = document.getElementById('matchDate').value;
            const apiDate = dateStr.replace(/-/g, ''); // ESPN attend le format YYYYMMDD
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Connexion directe à ESPN...';
                document.getElementById('matchesContainer').innerHTML = '';
            }
            
            try {
                // CONNEXION DIRECTE SANS AUCUN PROXY - Ne sera pas bloqué par uBlock/Adblock
                const atpUrl = `https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard?dates=${apiDate}`;
                const wtaUrl = `https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard?dates=${apiDate}`;

                const [atpRes, wtaRes] = await Promise.all([
                    fetch(atpUrl).catch(e => null), // Attrape l'erreur si l'un des deux échoue
                    fetch(wtaUrl).catch(e => null)
                ]);

                if (!atpRes && !wtaRes) {
                    throw new Error("Impossible de joindre les serveurs");
                }

                let allEvents = [];

                if (atpRes && atpRes.ok) {
                    const atpData = await atpRes.json();
                    if (atpData.events) allEvents = allEvents.concat(atpData.events);
                }

                if (wtaRes && wtaRes.ok) {
                    const wtaData = await wtaRes.json();
                    if (wtaData.events) allEvents = allEvents.concat(wtaData.events);
                }
                
                let validMatches = [];

                allEvents.forEach(ev => {
                    try {
                        let match = ev.competitions[0];
                        let p1 = match.competitors[0];
                        let p2 = match.competitors[1];

                        // Status
                        let isFinished = match.status.type.completed;
                        let isLive = match.status.type.state === 'in' || match.status.type.description === 'In Progress';
                        let status = isLive ? 'IN_PLAY' : (isFinished ? 'FINISHED' : 'TIMED');

                        // Noms
                        let homeName = p1.athlete?.shortName || p1.athlete?.displayName || "Joueur 1";
                        let awayName = p2.athlete?.shortName || p2.athlete?.displayName || "Joueur 2";
                        
                        // Tournoi
                        let tournName = ev.name || match.tournament?.displayName || "Circuit ATP/WTA";

                        // Score (ESPN donne souvent le score sous forme de string ou dans 'score')
                        let score1 = p1.score || "0";
                        let score2 = p2.score || "0";

                        validMatches.push({
                            id: ev.id.toString(),
                            status: status,
                            utcDate: ev.date,
                            competition: { name: tournName },
                            homeTeam: { name: homeName },
                            awayTeam: { name: awayName },
                            score: { 
                                current: { home: score1, away: score2 }, 
                                fullTime: { home: score1, away: score2 } 
                            }
                        });
                    } catch (err) {
                        // On ignore discrètement les matchs où il manque des données
                    }
                });

                currentMatches = validMatches;
                
                if (currentMatches.length === 0) {
                    statusText.innerHTML = `<span class="text-zinc-400"><i class="fa-solid fa-circle-info mr-1"></i> Aucun match programmé à cette date sur ESPN.</span>`;
                    populateCompetitions([]);
                    calculateDailyBankroll();
                    return;
                }

                if (!isSilent) {
                    statusText.innerHTML = `<span class="text-lime-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentMatches.length} matchs réels chargés (Direct)</span>`;
                }
                
                populateCompetitions(currentMatches);
                applyFilters();
                calculateDailyBankroll();

            } catch (error) {
                console.error("Erreur complète :", error);
                statusText.innerHTML = `<span class="text-red-400 font-semibold text-[10px]"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Erreur: ${error.message}</span>`;
            }
        }

        function populateCompetitions(matches) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            
            if (select.options.length > 1 && document.activeElement === select) return;

            select.innerHTML = '<option value="ALL">Tous les tournois</option>';
            const compsMap = new Map();
            
            matches.forEach(m => {
                if(m.competition && m.competition.name) {
                    compsMap.set(m.competition.name, m.competition.name);
                }
            });
            
            Array.from(compsMap.keys()).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });

            if (Array.from(compsMap.keys()).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if(isLiveFilterActive) {
                btn.classList.replace('bg-red-900/40', 'bg-red-600');
                btn.classList.replace('text-red-400', 'text-white');
            } else {
                btn.classList.replace('bg-red-600', 'bg-red-900/40');
                btn.classList.replace('text-white', 'text-red-400');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentMatches;
            if (isLiveFilterActive) filtered = filtered.filter(m => m.status === 'IN_PLAY' || m.status === 'PAUSED');
            
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(m => m.competition && m.competition.name === selectedComp);
            
            renderMatches(filtered);
        }

        function computeAlgoPick(p1, p2) {
            p1 = String(p1 || ""); p2 = String(p2 || "");
            const topTier = ["Sinner", "Alcaraz", "Djokovic", "Medvedev", "Zverev", "Swiatek", "Sabalenka", "Gauff", "Rybakina", "Humbert", "Fils"];
            let f1 = 50; let f2 = 50; 
            topTier.forEach(p => {
                if(p1.includes(p)) f1 += 20;
                if(p2.includes(p)) f2 += 20; 
            });
            return f1 >= f2 ? 'P1' : 'P2';
        }

        function renderMatches(matchesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};

            container.innerHTML = '';

            if (matchesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucun match ne correspond au filtre sélectionné.</div>`;
                return;
            }

            matchesToRender.forEach(match => {
                let isFinished = match.status === 'FINISHED';
                let isLive = match.status === 'IN_PLAY';
                
                let homeName = match.homeTeam.name;
                let awayName = match.awayTeam.name;
                
                let sHome = match.score.current.home;
                let sAway = match.score.current.away;

                let timeStr = new Date(match.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${timeStr}</span>`;
                if (isLive) statusBadge = `<span class="bg-red-900/60 text-red-300 border border-red-500/40 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold animate-pulse">🔴 En direct</span>`;
                if (isFinished) statusBadge = `<span class="bg-zinc-800 text-zinc-500 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Terminé</span>`;

                // Convertir les scores en nombres pour déterminer le gagnant
                let numScore1 = parseInt(sHome) || 0;
                let numScore2 = parseInt(sAway) || 0;

                let winner = null;
                if (isFinished) {
                    if (numScore1 > numScore2) winner = 'P1';
                    else if (numScore2 > numScore1) winner = 'P2';
                }

                let myBet = savedBets[match.id]; 
                let algoPick = computeAlgoPick(homeName, awayName);

                let baseClass = "relative flex flex-col items-center justify-center p-3 rounded-xl border transition ";
                let homeClass = baseClass; let awayClass = baseClass;

                if (algoPick === 'P1') homeClass += "bg-lime-900/20 border-lime-500/40 ";
                else homeClass += "bg-zinc-800/50 border-zinc-700/50 hover:bg-zinc-800 ";

                if (algoPick === 'P2') awayClass += "bg-cyan-900/20 border-cyan-500/40 ";
                else awayClass += "bg-zinc-800/50 border-zinc-700/50 hover:bg-zinc-800 ";

                if (myBet === 'P1') homeClass = baseClass + "bg-lime-600/40 border-lime-400 shadow-[0_0_10px_rgba(163,230,53,0.3)] ";
                if (myBet === 'P2') awayClass = baseClass + "bg-cyan-600/40 border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.3)] ";

                let card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-md";

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800/50 pb-2 mb-3">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center text-right w-2/3 truncate"><i class="fa-solid fa-trophy text-lime-400 mr-1.5"></i>${match.competition.name}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <button onclick="placeBet('${match.id}', 'P1')" class="${homeClass}">
                            <span class="text-[12px] font-black text-center leading-tight mb-1 w-full ${myBet === 'P1' ? 'text-white' : 'text-lime-400'} drop-shadow-md truncate px-1">${homeName}</span>
                            <span class="text-xl font-black ${isFinished && winner === 'P1' ? 'text-lime-400' : (myBet === 'P1' ? 'text-white' : 'text-zinc-300')}">${sHome}</span>
                        </button>

                        <button onclick="placeBet('${match.id}', 'P2')" class="${awayClass}">
                            <span class="text-[12px] font-black text-center leading-tight mb-1 w-full ${myBet === 'P2' ? 'text-white' : 'text-cyan-400'} drop-shadow-md truncate px-1">${awayName}</span>
                            <span class="text-xl font-black ${isFinished && winner === 'P2' ? 'text-lime-400' : (myBet === 'P2' ? 'text-white' : 'text-zinc-300')}">${sAway}</span>
                        </button>
                    </div>
                    
                    ${myBet ? `
                    <div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-zinc-800">
                        ${isFinished 
                            ? (myBet === winner ? '<span class="text-lime-400 font-bold"><i class="fa-solid fa-check"></i> Gagné</span>' : '<span class="text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Perdu</span>') 
                            : '<span class="text-lime-400">Pari Vainqueur enregistré</span>'
                        }
                    </div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function placeBet(matchId, pick) {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};
            if(savedBets[matchId] === pick) {
                delete savedBets[matchId];
                showToast("Pari annulé");
            } else {
                savedBets[matchId] = pick;
                showToast("Pari validé", "success");
            }
            localStorage.setItem(`tennisbet_${dateStr}`, JSON.stringify(savedBets));
            applyFilters();
            calculateDailyBankroll();
        }

        function calculateDailyBankroll() {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};
            
            let dailyProfit = 0; let betsCount = 0; let currentBankroll = INITIAL_BANKROLL;

            currentMatches.forEach(match => {
                let myBet = savedBets[match.id];
                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);

                    if (match.status === 'FINISHED' || match.status === 'AWARDED') {
                        let numScore1 = parseInt(match.score.current.home) || 0;
                        let numScore2 = parseInt(match.score.current.away) || 0;
                        let winner = numScore1 > numScore2 ? 'P1' : (numScore2 > numScore1 ? 'P2' : null);
                        
                        if (winner) {
                            if (myBet === winner) {
                                dailyProfit += ((1.75 * currentStake) - currentStake);
                            } else {
                                dailyProfit -= currentStake;
                            }
                        }
                    }
                    currentBankroll += dailyProfit;
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-lime-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;
            document.getElementById('headerBankroll').textContent = `${(INITIAL_BANKROLL + dailyProfit).toFixed(2)} €`;
        }

        function toggleHistoryStats() {
            let block = document.getElementById('historyBlock');
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                // Code historique statique supprimé pour l'exemple
            } else {
                block.classList.add('hidden');
            }
        }

        window.onload = loadTennisMatches;
    </script>
</body>
</html>
