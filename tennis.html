<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TennisBet Pro - Live & Historique</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-lime-400 flex items-center">
                <i class="fa-solid fa-trophy mr-2"></i>TennisBet Pro
            </h1>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-lime-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-lime-400" onchange="loadTennisMatches()">
                <button onclick="toggleHistoryStats()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 font-bold transition flex items-center shadow relative" title="Historique Semaine & Mois">
                    <i class="fa-solid fa-calendar-days text-lime-400"></i>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-fire mr-1.5"></i> En Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-lime-400 flex-grow">
                <option value="ALL">Tous les tournois</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-lime-400 font-mono flex items-center w-3/4 truncate">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Lecture des tableaux ATP/WTA...
            </div>
            <button onclick="loadTennisMatches(false)" class="bg-zinc-800 hover:bg-zinc-700 text-lime-400 px-3 py-1.5 rounded-lg border border-lime-500/30 text-xs font-bold transition flex items-center shadow">
                <i class="fa-solid fa-rotate mr-1.5"></i> Actualiser
            </button>
        </div>

        <!-- HISTORIQUE CUMULÉ SEMAINE & MOIS -->
        <div id="historyBlock" class="hidden bg-zinc-900 border border-lime-500/30 rounded-2xl p-4 shadow-xl mb-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase text-zinc-300 tracking-wider flex items-center">
                    <i class="fa-solid fa-vault mr-1.5 text-lime-400"></i> Vos Gains Cumulés Tennis
                </h2>
                <button onclick="toggleHistoryStats()" class="text-zinc-500 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700 text-xs">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Semaine en cours</h3>
                    <div class="flex justify-between font-black"><span class="text-white">BÉNÉFICE NET :</span><span id="weekTotal" class="text-lime-400">0.00 €</span></div>
                </div>
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Mois par Mois (<span id="currentYearText"></span>)</h3>
                    <div id="monthsGrid" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-lime-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-lime-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-zinc-400 uppercase">Matchs pariés</div>
                <div id="dailyBetsCount" class="text-sm font-bold text-zinc-300">0</div>
            </div>
        </div>

        <div id="matchesContainer" class="space-y-3"></div>

    </main>

    <script>
        const now = new Date();
        const localDateStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        document.getElementById('matchDate').value = localDateStr;

        let currentMatches = [];
        let isLiveFilterActive = false;
        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02; 

        setInterval(() => {
            if (document.getElementById('matchDate').value === localDateStr || isLiveFilterActive) {
                loadTennisMatches(true);
            }
        }, 30000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-lime-900/90 border-lime-500/50 text-lime-200' : (type === 'error' ? 'bg-red-900/90 border-red-500/50 text-red-200' : 'bg-zinc-800 border-zinc-700 text-white');
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // CORRECTION DE LA FONCTION : Affiche toujours Sets + Jeux si le match est en direct
        function extractSetsWon(competitor, isCompleted) {
            if (competitor.linescores && competitor.linescores.length > 0) {
                let sets = 0;
                competitor.linescores.forEach(ls => {
                    if (ls.winner === true) sets++;
                });
                
                if (isCompleted) return sets; // Si match fini, on donne juste le score en sets

                let currentGames = competitor.linescores[competitor.linescores.length - 1]?.value;
                if (currentGames !== undefined) {
                    return `${sets} (${currentGames}j)`; // Affiche les jeux même si sets > 0
                }
                return sets;
            }
            if (competitor.score !== undefined && competitor.score !== null && competitor.score !== "") {
                return competitor.score;
            }
            return 0;
        }

        async function loadTennisMatches(isSilent = false) {
            const dateStr = document.getElementById('matchDate').value;
            const apiDate = dateStr.replace(/-/g, '');
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Récupération directe des tableaux ATP & WTA...';
                document.getElementById('matchesContainer').innerHTML = '';
            }
            
            try {
                const urls = [
                    `https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard?dates=${apiDate}`,
                    `https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard?dates=${apiDate}`
                ];

                const responses = await Promise.all(urls.map(u => fetch(u).catch(() => null)));
                let validMatches = [];

                for (let res of responses) {
                    if (!res || !res.ok) continue;
                    const data = await res.json();
                    
                    (data.events || []).forEach(tournament => {
                        const baseTournName = tournament.name || "Tournoi ATP/WTA";
                        
                        let allCompetitions = [];
                        if (tournament.groupings && Array.isArray(tournament.groupings)) {
                            tournament.groupings.forEach(group => {
                                const drawName = group.grouping?.displayName || "";
                                (group.competitions || []).forEach(comp => {
                                    comp._fullTournName = drawName ? `${baseTournName} (${drawName})` : baseTournName;
                                    allCompetitions.push(comp);
                                });
                            });
                        } else if (tournament.competitions && Array.isArray(tournament.competitions)) {
                            tournament.competitions.forEach(comp => {
                                comp._fullTournName = baseTournName;
                                allCompetitions.push(comp);
                            });
                        }

                        allCompetitions.forEach(comp => {
                            if (!comp.competitors || comp.competitors.length < 2) return;

                            const compDateStr = comp.date ? new Date(comp.date).toISOString().split('T')[0] : dateStr;
                            const state = comp.status?.type?.state || 'pre';
                            const isCompleted = comp.status?.type?.completed || state === 'post';
                            const isLive = state === 'in';

                            if (compDateStr !== dateStr && !isLive) return;

                            let p1 = comp.competitors[0];
                            let p2 = comp.competitors[1];

                            let homeName = p1.athlete?.shortName || p1.athlete?.displayName || p1.roster?.shortDisplayName || p1.team?.displayName || "TBD";
                            let awayName = p2.athlete?.shortName || p2.athlete?.displayName || p2.roster?.shortDisplayName || p2.team?.displayName || "TBD";

                            if (homeName === "TBD" && awayName === "TBD") return;

                            let status = isLive ? 'IN_PLAY' : (isCompleted ? 'FINISHED' : 'TIMED');
                            let s1 = extractSetsWon(p1, isCompleted);
                            let s2 = extractSetsWon(p2, isCompleted);

                            let winner = null;
                            if (isCompleted) {
                                if (p1.winner === true) winner = 'P1';
                                else if (p2.winner === true) winner = 'P2';
                            }

                            validMatches.push({
                                id: comp.id.toString(),
                                status: status,
                                statusDetail: comp.status?.type?.shortDetail || "",
                                utcDate: comp.date || tournament.date,
                                competition: { name: comp._fullTournName },
                                homeTeam: { name: homeName },
                                awayTeam: { name: awayName },
                                winner: winner,
                                score: { current: { home: s1, away: s2 } }
                            });
                        });
                    });
                }

                validMatches.sort((a, b) => {
                    if (a.status === 'IN_PLAY' && b.status !== 'IN_PLAY') return -1;
                    if (b.status === 'IN_PLAY' && a.status !== 'IN_PLAY') return 1;
                    return new Date(a.utcDate) - new Date(b.utcDate);
                });

                currentMatches = validMatches;

                if (currentMatches.length === 0) {
                    statusText.innerHTML = `<span class="text-zinc-400">Aucun match programmé à cette date précise.</span>`;
                } else {
                    const liveCount = currentMatches.filter(m => m.status === 'IN_PLAY').length;
                    if (!isSilent) {
                        statusText.innerHTML = `<span class="text-lime-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentMatches.length} matchs chargés (${liveCount} en direct)</span>`;
                    }
                }
                
                populateCompetitions(currentMatches);
                applyFilters();
                calculateDailyBankroll();

            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span class="text-red-400 font-semibold">Erreur lors de la lecture des tableaux.</span>`;
            }
        }

        function populateCompetitions(matches) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            select.innerHTML = '<option value="ALL">Tous les tournois</option>';
            const compsMap = new Map();
            
            matches.forEach(m => {
                if (m.competition?.name) {
                    compsMap.set(m.competition.name, (compsMap.get(m.competition.name) || 0) + 1);
                }
            });
            
            Array.from(compsMap.keys()).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `${c} (${compsMap.get(c)})`;
                select.appendChild(opt);
            });
            
            if (Array.from(compsMap.keys()).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if (isLiveFilterActive) {
                btn.classList.replace('bg-red-900/40', 'bg-red-600');
                btn.classList.replace('text-red-400', 'text-white');
            } else {
                btn.classList.replace('bg-red-600', 'bg-red-900/40');
                btn.classList.replace('text-white', 'text-red-400');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentMatches;
            if (isLiveFilterActive) filtered = filtered.filter(m => m.status === 'IN_PLAY');
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(m => m.competition?.name === selectedComp);
            renderMatches(filtered);
        }

        function computeAlgoPick(p1, p2) {
            p1 = String(p1 || ""); p2 = String(p2 || "");
            const topTier = ["Sinner", "Alcaraz", "Zverev", "Djokovic", "Medvedev", "Fritz", "Ruud", "Rublev", "De Minaur", "Dimitrov", "Tsitsipas", "Humbert", "Fils", "Sabalenka", "Swiatek", "Gauff", "Pegula", "Rybakina"];
            let f1 = 50; let f2 = 50; 
            topTier.forEach(p => {
                if (p1.toLowerCase().includes(p.toLowerCase())) f1 += 20;
                if (p2.toLowerCase().includes(p.toLowerCase())) f2 += 20; 
            });
            return f1 >= f2 ? 'P1' : 'P2';
        }

        function renderMatches(matchesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};

            container.innerHTML = '';

            if (matchesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucun match pour ce filtre actuellement.</div>`;
                return;
            }

            matchesToRender.forEach(match => {
                let isFinished = match.status === 'FINISHED';
                let isLive = match.status === 'IN_PLAY';
                
                let homeName = match.homeTeam.name;
                let awayName = match.awayTeam.name;
                
                let sHome = match.score.current.home;
                let sAway = match.score.current.away;

                let timeStr = new Date(match.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${timeStr}</span>`;
                if (isLive) statusBadge = `<span class="bg-red-900/60 text-red-300 border border-red-500/40 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold animate-pulse">🔴 En direct (${match.statusDetail})</span>`;
                if (isFinished) statusBadge = `<span class="bg-zinc-800 text-zinc-500 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Terminé</span>`;

                let winner = match.winner;
                let myBet = savedBets[match.id]; 
                let algoPick = computeAlgoPick(homeName, awayName);

                let baseClass = "relative flex flex-col items-center justify-center p-3 rounded-xl border transition ";
                let homeClass = baseClass + (algoPick === 'P1' ? "bg-lime-900/20 border-lime-500/40 " : "bg-zinc-800/50 border-zinc-700/50 hover:bg-zinc-800 ");
                let awayClass = baseClass + (algoPick === 'P2' ? "bg-cyan-900/20 border-cyan-500/40 " : "bg-zinc-800/50 border-zinc-700/50 hover:bg-zinc-800 ");

                if (myBet === 'P1') homeClass = baseClass + "bg-lime-600/40 border-lime-400 shadow-[0_0_10px_rgba(163,230,53,0.3)] ";
                if (myBet === 'P2') awayClass = baseClass + "bg-cyan-600/40 border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.3)] ";

                if (isFinished) {
                    homeClass = homeClass.replace('hover:bg-zinc-800', '') + ' cursor-not-allowed opacity-80';
                    awayClass = awayClass.replace('hover:bg-zinc-800', '') + ' cursor-not-allowed opacity-80';
                }

                let card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-md";

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800/50 pb-2 mb-3">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center text-right w-2/3 truncate justify-end"><i class="fa-solid fa-trophy text-lime-400 mr-1.5"></i>${match.competition.name}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <button ${isFinished ? 'disabled' : `onclick="placeBet('${match.id}', 'P1')"`} class="${homeClass}">
                            <span class="text-[12px] font-black text-center leading-tight mb-1 w-full ${myBet === 'P1' ? 'text-white' : 'text-lime-400'} drop-shadow-md truncate px-1">${homeName}</span>
                            <span class="text-lg font-black ${isFinished && winner === 'P1' ? 'text-lime-400' : 'text-zinc-200'}">Sets: ${sHome}</span>
                        </button>

                        <button ${isFinished ? 'disabled' : `onclick="placeBet('${match.id}', 'P2')"`} class="${awayClass}">
                            <span class="text-[12px] font-black text-center leading-tight mb-1 w-full ${myBet === 'P2' ? 'text-white' : 'text-cyan-400'} drop-shadow-md truncate px-1">${awayName}</span>
                            <span class="text-lg font-black ${isFinished && winner === 'P2' ? 'text-lime-400' : 'text-zinc-200'}">Sets: ${sAway}</span>
                        </button>
                    </div>
                    
                    ${myBet ? `
                    <div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-zinc-800">
                        ${isFinished 
                            ? (myBet === winner ? '<span class="text-lime-400 font-bold"><i class="fa-solid fa-check"></i> Pari Gagné</span>' : '<span class="text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Pari Perdu</span>') 
                            : '<span class="text-lime-400">Pari enregistré (En attente du résultat)</span>'
                        }
                    </div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function placeBet(matchId, pick) {
            let match = currentMatches.find(m => m.id === matchId);
            if (match && match.status === 'FINISHED') {
                showToast("Ce match est terminé, les paris sont clos.", "error");
                return;
            }

            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};
            if (savedBets[matchId] === pick) {
                delete savedBets[matchId];
                showToast("Pari annulé");
            } else {
                savedBets[matchId] = pick;
                showToast("Pari validé", "success");
            }
            localStorage.setItem(`tennisbet_${dateStr}`, JSON.stringify(savedBets));
            applyFilters();
            calculateDailyBankroll();
        }

        function calculateDailyBankroll() {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};
            
            let dailyProfit = 0; let betsCount = 0; let currentBankroll = INITIAL_BANKROLL;

            currentMatches.forEach(match => {
                let myBet = savedBets[match.id];
                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);

                    if (match.status === 'FINISHED' && match.winner) {
                        if (myBet === match.winner) {
                            dailyProfit += ((1.75 * currentStake) - currentStake);
                        } else {
                            dailyProfit -= currentStake;
                        }
                    }
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-lime-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;
            document.getElementById('headerBankroll').textContent = `${(INITIAL_BANKROLL + dailyProfit).toFixed(2)} €`;

            if (betsCount > 0 || dailyProfit !== 0 || (savedBets && Object.keys(savedBets).length > 0)) {
                let history = JSON.parse(localStorage.getItem('tennisbet_full_history')) || {};
                history[dateStr] = dailyProfit;
                localStorage.setItem('tennisbet_full_history', JSON.stringify(history));
            }

            if (!document.getElementById('historyBlock').classList.contains('hidden')) {
                showHistoryStats();
            }
        }

        function toggleHistoryStats() {
            let block = document.getElementById('historyBlock');
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                showHistoryStats();
            } else {
                block.classList.add('hidden');
            }
        }

        function showHistoryStats() {
            let dateInput = document.getElementById('matchDate').value;
            let currentViewDate = dateInput ? new Date(dateInput) : new Date();
            let year = currentViewDate.getFullYear();
            
            document.getElementById('currentYearText').textContent = year;
            let history = JSON.parse(localStorage.getItem('tennisbet_full_history')) || {};

            let dayOfWeek = currentViewDate.getDay() || 7; 
            let monday = new Date(currentViewDate);
            monday.setDate(currentViewDate.getDate() - (dayOfWeek - 1)); 
            
            let wTotal = 0;
            for (let i = 0; i < 7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                let dStr = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                wTotal += history[dStr] || 0;
            }

            let wpEl = document.getElementById('weekTotal');
            wpEl.textContent = `${wTotal > 0 ? '+' : ''}${wTotal.toFixed(2)} €`;
            wpEl.className = wTotal > 0 ? 'text-lime-400 font-black' : (wTotal < 0 ? 'text-red-400 font-black' : 'text-zinc-400 font-black');

            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
            let monthsGrid = document.getElementById('monthsGrid');
            monthsGrid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                let mTot = 0;
                let hasData = false;
                let daysInMonth = new Date(year, m + 1, 0).getDate(); 
                
                for (let d = 1; d <= daysInMonth; d++) {
                    let mm = String(m + 1).padStart(2, '0');
                    let dd = String(d).padStart(2, '0');
                    let dStr = `${year}-${mm}-${dd}`;
                    if (history[dStr] !== undefined) {
                        hasData = true;
                        mTot += history[dStr] || 0;
                    }
                }

                if (hasData) {
                    let div = document.createElement('div');
                    let isCurrentMonth = (m === currentViewDate.getMonth());
                    div.className = isCurrentMonth 
                        ? "bg-zinc-800 p-3 rounded-xl border border-lime-500/50 mb-2 flex justify-between items-center text-xs" 
                        : "bg-zinc-800/50 p-3 rounded-xl border border-zinc-700/50 mb-2 flex justify-between items-center text-xs";

                    let totColor = mTot >= 0 ? 'text-lime-400' : 'text-red-400';
                    div.innerHTML = `
                        <span class="font-bold ${isCurrentMonth ? 'text-white' : 'text-zinc-300'}">${monthNames[m]}</span>
                        <span class="font-black ${totColor}">${mTot > 0 ? '+' : ''}${mTot.toFixed(2)} €</span>
                    `;
                    monthsGrid.appendChild(div);
                }
            }

            if (monthsGrid.innerHTML === '') {
                monthsGrid.innerHTML = '<div class="text-zinc-500 text-center text-xs py-2">Naviguez sur une date pour enregistrer les bilans.</div>';
            }
        }

        window.onload = loadTennisMatches;
    </script>
</body>
</html>
