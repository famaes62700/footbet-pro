<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TennisBet Pro - Live & Proportionnelle</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-lime-400 flex items-center">
                <i class="fa-solid fa-table-tennis mr-2"></i>TennisBet Pro
            </h1>
            <div class="flex items-center space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-lime-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-lime-400" onchange="loadTennisMatches()">
                <button onclick="toggleHistoryStats()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 font-bold transition flex items-center shadow relative">
                    <i class="fa-solid fa-calendar-days"></i>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-fire mr-1.5"></i> En Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-lime-400 flex-grow">
                <option value="ALL">Tous les tournois</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-lime-400 font-mono flex items-center">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Recherche des matchs...
            </div>
            <button onclick="loadTennisMatches(false)" class="text-zinc-400 hover:text-lime-400 transition" title="Actualiser">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <div id="historyBlock" class="hidden bg-zinc-900 border border-lime-500/30 rounded-2xl p-4 shadow-xl mb-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase text-zinc-300 tracking-wider flex items-center">
                    <i class="fa-solid fa-vault mr-1.5 text-lime-400"></i> Vos Gains Cumulés Tennis
                </h2>
                <button onclick="toggleHistoryStats()" class="text-zinc-500 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Semaine en cours</h3>
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-zinc-400">Bénéfice Net :</span>
                        <span id="weekProfit" class="text-lime-400">-- €</span>
                    </div>
                </div>
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Mois par Mois (<span id="currentYearText"></span>)</h3>
                    <div id="monthsGrid" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-lime-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-lime-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-zinc-400 uppercase">Matchs pariés</div>
                <div id="dailyBetsCount" class="text-sm font-bold text-zinc-300">0</div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between items-center text-xs text-zinc-300 shadow-md">
            <span><i class="fa-solid fa-wallet mr-1.5 text-lime-400"></i> Total Mises (Tennis) :</span>
            <span id="totalSpentText" class="font-bold text-white">0.00 €</span>
        </div>

        <div id="matchesContainer" class="space-y-3">
            <!-- Rempli dynamiquement -->
        </div>

    </main>

    <script>
        // Utilisation d'une route API (fictive/simulation) identique à la logique Foot/NBA
        const TENNIS_API_KEY = "tennis_api_key_placeholder"; 

        document.getElementById('matchDate').valueAsDate = new Date();
        let currentMatches = [];
        let isLiveFilterActive = false;

        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02; 

        setInterval(() => {
            let today = new Date().toISOString().split('T')[0];
            let selectedDate = document.getElementById('matchDate').value;
            if (selectedDate === today || isLiveFilterActive) {
                loadTennisMatches(true);
            }
        }, 30000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-lime-900/90 border-lime-500/50 text-lime-200' : 'bg-zinc-800 border-zinc-700 text-white';
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadTennisMatches(isSilent = false) {
            const dateInput = document.getElementById('matchDate').value;
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Recherche des matchs...';
                document.getElementById('matchesContainer').innerHTML = '';
            }
            
            try {
                const res = await fetch(`/api/tennis/matches?date=${dateInput}&_t=${new Date().getTime()}`, {
                    headers: { 'X-Auth-Token': TENNIS_API_KEY, 'Cache-Control': 'no-cache' }
                });
                
                if (!res.ok) throw new Error("Erreur réseau API");
                const data = await res.json();
                
                currentMatches = data.matches || [];
                
                if (currentMatches.length === 0) {
                    statusText.innerHTML = `<span class="text-zinc-400">Aucun tournoi majeur ce jour.</span>`;
                    populateCompetitions([]);
                    calculateDailyBankroll();
                    return;
                }

                if (!isSilent) {
                    statusText.innerHTML = `<span class="text-lime-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentMatches.length} matchs trouvés</span>`;
                }
                
                populateCompetitions(currentMatches);
                applyFilters();
                calculateDailyBankroll();

            } catch (e) {
                if (!isSilent) {
                    statusText.innerHTML = '<span class="text-red-400 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Connexion API (Simulée)</span>';
                    simulateTennisMatches();
                }
            }
        }

        // Simulation pour pouvoir tester l'interface
        function simulateTennisMatches() {
            currentMatches = [
                { id: "t1", status: "IN_PLAY", utcDate: new Date().toISOString(), competition: { name: "ATP Masters 1000 Paris" }, homeTeam: { name: "C. Alcaraz" }, awayTeam: { name: "U. Humbert" }, score: { current: { home: 1, away: 0 } } },
                { id: "t2", status: "FINISHED", utcDate: new Date(new Date().getTime() - 7200000).toISOString(), competition: { name: "WTA Finals Riyadh" }, homeTeam: { name: "I. Swiatek" }, awayTeam: { name: "C. Gauff" }, score: { fullTime: { home: 2, away: 0 } } },
                { id: "t3", status: "TIMED", utcDate: new Date(new Date().getTime() + 7200000).toISOString(), competition: { name: "ATP Masters 1000 Paris" }, homeTeam: { name: "J. Sinner" }, awayTeam: { name: "A. Zverev" }, score: {} }
            ];
            populateCompetitions(currentMatches);
            applyFilters();
            calculateDailyBankroll();
        }

        function populateCompetitions(matches) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            
            if (select.options.length > 1 && document.activeElement === select) return;

            select.innerHTML = '<option value="ALL">Tous les tournois</option>';
            const compsMap = new Map();
            
            matches.forEach(m => {
                if(m.competition && m.competition.name) {
                    compsMap.set(m.competition.name, `🎾 ${m.competition.name}`);
                }
            });
            
            Array.from(compsMap.keys()).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = compsMap.get(c);
                select.appendChild(opt);
            });

            if (Array.from(compsMap.keys()).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if(isLiveFilterActive) {
                btn.classList.replace('bg-red-900/40', 'bg-red-600');
                btn.classList.replace('text-red-400', 'text-white');
            } else {
                btn.classList.replace('bg-red-600', 'bg-red-900/40');
                btn.classList.replace('text-white', 'text-red-400');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentMatches;
            if (isLiveFilterActive) filtered = filtered.filter(m => m.status === 'IN_PLAY' || m.status === 'PAUSED');
            
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(m => m.competition && m.competition.name === selectedComp);
            
            renderMatches(filtered);
        }

        function computeAlgoPick(p1, p2) {
            p1 = String(p1 || "");
            p2 = String(p2 || "");
            
            const topTier = ["Sinner", "Alcaraz", "Djokovic", "Medvedev", "Zverev", "Swiatek", "Sabalenka", "Gauff", "Rybakina", "Paolini"];
            
            let f1 = 50; 
            let f2 = 50; 
            
            topTier.forEach(p => {
                if(p1.includes(p)) f1 += 20;
                if(p2.includes(p)) f2 += 20; 
            });
            
            let hash1 = (p1.charCodeAt(0) + p1.length) % 10;
            let hash2 = (p2.charCodeAt(0) + p2.length) % 10;
            
            f1 += hash1;
            f2 += hash2;
            
            return f1 >= f2 ? 'P1' : 'P2';
        }

        function extractScore(match, team) {
            if (!match || !match.score) return "-";
            let val = match.score?.fullTime?.[team] ?? match.score?.current?.[team];
            
            if (val === null || val === undefined) {
                if (match.status === 'IN_PLAY' || match.status === 'FINISHED') return 0;
                return "-";
            }
            return val;
        }

        function renderMatches(matchesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};

            container.innerHTML = '';

            if (matchesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucun match ne correspond à vos filtres.</div>`;
                return;
            }

            matchesToRender.forEach(match => {
                let status = match.status; 
                let isFinished = status === 'FINISHED' || status === 'AWARDED';
                let isLive = status === 'IN_PLAY';
                
                let time = new Date(match.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                
                let home = match.homeTeam || {};
                let away = match.awayTeam || {};
                let homeName = home.name || "Joueur 1";
                let awayName = away.name || "Joueur 2";
                
                let sHome = extractScore(match, 'home');
                let sAway = extractScore(match, 'away');

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${time}</span>`;
                if (isLive) {
                    statusBadge = `<span class="bg-red-900/60 text-red-300 border border-red-500/40 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold animate-pulse">🔴 En direct</span>`;
                }
                if (isFinished) statusBadge = `<span class="bg-zinc-800 text-zinc-500 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Terminé</span>`;

                let winner = null;
                if (isFinished) {
                    if (sHome > sAway) winner = 'P1';
                    else if (sAway > sHome) winner = 'P2';
                }

                let myBet = savedBets[match.id]; 
                let algoPick = computeAlgoPick(homeName, awayName);

                let baseClass = "relative flex flex-col items-center justify-center p-3 rounded-xl border transition ";
                let homeClass = baseClass;
                let awayClass = baseClass;

                if (algoPick === 'P1') homeClass += "bg-lime-900/20 border-lime-500/40 ";
                else homeClass += "bg-zinc-800/50 border-zinc-700/50 hover:bg-zinc-800 ";

                if (algoPick === 'P2') awayClass += "bg-cyan-900/20 border-cyan-500/40 ";
                else awayClass += "bg-zinc-800/50 border-zinc-700/50 hover:bg-zinc-800 ";

                if (myBet === 'P1') homeClass = baseClass + "bg-lime-600/40 border-lime-400 shadow-[0_0_10px_rgba(163,230,53,0.3)] ";
                if (myBet === 'P2') awayClass = baseClass + "bg-cyan-600/40 border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.3)] ";

                let card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-md";
                let compName = match.competition?.name || "Tournoi ATP/WTA";

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800/50 pb-2 mb-3">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center">🎾 ${compName}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <button onclick="placeBet('${match.id}', 'P1')" class="${homeClass}">
                            <span class="text-[12px] font-black text-center leading-tight mb-1 w-full ${myBet === 'P1' ? 'text-white' : 'text-lime-400'} drop-shadow-md">${homeName}</span>
                            <span class="text-xl font-black ${isFinished && winner === 'P1' ? 'text-lime-400' : (myBet === 'P1' ? 'text-white' : 'text-zinc-300')}">Sets: ${sHome}</span>
                        </button>

                        <button onclick="placeBet('${match.id}', 'P2')" class="${awayClass}">
                            <span class="text-[12px] font-black text-center leading-tight mb-1 w-full ${myBet === 'P2' ? 'text-white' : 'text-cyan-400'} drop-shadow-md">${awayName}</span>
                            <span class="text-xl font-black ${isFinished && winner === 'P2' ? 'text-lime-400' : (myBet === 'P2' ? 'text-white' : 'text-zinc-300')}">Sets: ${sAway}</span>
                        </button>
                    </div>
                    
                    ${myBet ? `
                    <div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-zinc-800">
                        ${isFinished 
                            ? (myBet === winner ? '<span class="text-lime-400 font-bold"><i class="fa-solid fa-check"></i> Gagné</span>' : '<span class="text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Perdu</span>') 
                            : '<span class="text-lime-400">Pari Vainqueur enregistré (Mise dynamique)</span>'
                        }
                    </div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function placeBet(matchId, pick) {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};
            
            if(savedBets[matchId] === pick) {
                delete savedBets[matchId];
                showToast("Pari annulé");
            } else {
                savedBets[matchId] = pick;
                showToast("Pari tennis validé", "success");
            }
            
            localStorage.setItem(`tennisbet_${dateStr}`, JSON.stringify(savedBets));
            applyFilters();
            calculateDailyBankroll();
        }

        function calculateDailyBankroll() {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`tennisbet_${dateStr}`)) || {};
            
            let dailyProfit = 0;
            let betsCount = 0;
            let totalSpent = 0;
            let currentBankroll = INITIAL_BANKROLL;
            let assumedOdds = 1.75; 

            currentMatches.forEach(match => {
                let status = match.status;
                let isFinished = status === 'FINISHED' || status === 'AWARDED';
                let myBet = savedBets[match.id];

                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);
                    totalSpent += currentStake;

                    if (isFinished) {
                        let sHome = extractScore(match, 'home');
                        let sAway = extractScore(match, 'away');
                        
                        let winner = sHome > sAway ? 'P1' : (sAway > sHome ? 'P2' : null);
                        
                        if (winner) {
                            let netMatch = 0;
                            if (myBet === winner) {
                                netMatch = (assumedOdds * currentStake) - currentStake;
                                dailyProfit += netMatch;
                            } else {
                                netMatch = -currentStake;
                                dailyProfit -= currentStake;
                            }
                            currentBankroll += netMatch;
                        }
                    }
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-lime-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;

            document.getElementById('totalSpentText').textContent = `${totalSpent.toFixed(2)} €`;
            document.getElementById('headerBankroll').textContent = `${currentBankroll.toFixed(2)} €`;

            let globalStats = JSON.parse(localStorage.getItem('tennisbet_history')) || {};
            globalStats[dateStr] = dailyProfit;
            localStorage.setItem('tennisbet_history', JSON.stringify(globalStats));

            if (!document.getElementById('historyBlock').classList.contains('hidden')) {
                showHistoryStats();
            }
        }

        function toggleHistoryStats() {
            let block = document.getElementById('historyBlock');
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                showHistoryStats();
            } else {
                block.classList.add('hidden');
            }
        }

        function showHistoryStats() {
            let dateInput = document.getElementById('matchDate').value;
            let currentViewDate = dateInput ? new Date(dateInput) : new Date();
            let year = currentViewDate.getFullYear();
            
            document.getElementById('currentYearText').textContent = year;
            let globalStats = JSON.parse(localStorage.getItem('tennisbet_history')) || {};

            let dayOfWeek = currentViewDate.getDay() || 7; 
            let monday = new Date(currentViewDate);
            monday.setDate(currentViewDate.getDate() - (dayOfWeek - 1)); 
            
            let weekProfit = 0;
            for(let i=0; i<7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                let dStr = d.toISOString().split('T')[0];
                weekProfit += globalStats[dStr] || 0;
            }
            
            let wpEl = document.getElementById('weekProfit');
            wpEl.textContent = `${weekProfit > 0 ? '+' : ''}${weekProfit.toFixed(2)} €`;
            wpEl.className = weekProfit > 0 ? 'text-lime-400 font-bold' : (weekProfit < 0 ? 'text-red-400 font-bold' : 'text-zinc-500');

            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
            let monthsGrid = document.getElementById('monthsGrid');
            monthsGrid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                let mProfit = 0;
                let daysInMonth = new Date(year, m + 1, 0).getDate(); 
                
                for (let d = 1; d <= daysInMonth; d++) {
                    let dateObj = new Date(year, m, d);
                    let dStr = dateObj.toISOString().split('T')[0];
                    mProfit += globalStats[dStr] || 0;
                }

                if (mProfit !== 0) {
                    let div = document.createElement('div');
                    let isCurrentViewMonth = (m === currentViewDate.getMonth());
                    div.className = isCurrentViewMonth 
                        ? "bg-zinc-800 p-3 rounded-xl border border-lime-500/50 mb-2 flex justify-between items-center" 
                        : "bg-zinc-800/50 p-3 rounded-xl border border-zinc-700/50 mb-2 flex justify-between items-center";

                    let colorCls = mProfit > 0 ? 'text-lime-400' : 'text-red-400';
                    div.innerHTML = `
                        <span class="font-bold text-sm ${isCurrentViewMonth ? 'text-lime-400' : 'text-zinc-300'}">${monthNames[m]}</span>
                        <span class="font-black ${colorCls}">${mProfit > 0 ? '+' : ''}${mProfit.toFixed(2)} €</span>
                    `;
                    monthsGrid.appendChild(div);
                }
            }
            if(monthsGrid.innerHTML === '') {
                monthsGrid.innerHTML = '<div class="text-zinc-500 text-center text-xs py-2">Aucune donnée Tennis pour cette année.</div>';
            }
        }

        window.onload = loadTennisMatches;
    </script>
</body>
</html>
