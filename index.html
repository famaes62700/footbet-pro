!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foot-turf-nba-nfl</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Foot-Turf">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 flex flex-col h-screen overflow-hidden font-sans select-none">
    
    <!-- BARRE DE NAVIGATION COMMUNE (MENU) -->
    <nav class="bg-zinc-900 border-b border-zinc-800 p-2.5 z-50 shadow-lg flex justify-center space-x-2 sm:space-x-3 overflow-x-auto whitespace-nowrap">
        <button onclick="switchApp('foot.html', this)" class="nav-btn bg-zinc-950 text-white border-emerald-500 px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border shadow-inner">
            <i class="fa-solid fa-futbol mr-2 text-emerald-500"></i> FOOT Direct
        </button>
        <button onclick="switchApp('turf.html', this)" class="nav-btn bg-zinc-800 text-zinc-400 hover:text-white px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border border-zinc-700 shadow">
            <i class="fa-solid fa-horse-head mr-2 text-emerald-500"></i> TURF Direct
        </button>
        <button onclick="switchApp('nba.html', this)" class="nav-btn bg-zinc-800 text-zinc-400 hover:text-white px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border border-zinc-700 shadow">
            <i class="fa-solid fa-basketball mr-2 text-orange-500"></i> NBA Direct
        </button>
        <button onclick="switchApp('tennis.html', this)" class="nav-btn bg-zinc-800 text-zinc-400 hover:text-white px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border border-zinc-700 shadow">
            <i class="fa-solid fa-football mr-1.5 text-[#8b4513]"></i> NFL Direct
        </button>
    </nav>

    <!-- ECRAN D'AFFICHAGE INTERNE -->
    <iframe id="appFrame" src="foot.html" class="flex-grow w-full border-none bg-zinc-950"></iframe>

    <script>
    const SUPABASE_URL = 'https://hvgrngfmbslpphrjldgl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_UKMHFE5XUdoenpv5Ds0bLA_Pcm-muaD';

    let prizes = [
        { id: 'iphone17', name: 'iPhone 17 Pro Max (256 Go)', value: 'Valeur : 1 479 €', tag: '🔥 N°1 Tech', icon: '📱', cost: 5.00, current: 398, max: 400, speed: 1.75, scores: [] },
        { id: 'ps5pro', name: 'PlayStation 5 Pro', value: 'Valeur : 799 €', tag: '🎮 N°1 Gaming', icon: '🕹️', cost: 3.00, current: 347, max: 350, speed: 1.65, scores: [] },
        { id: 'switch2', name: 'Nintendo Switch 2', value: 'Valeur : 449 €', tag: '⭐ Populaire', icon: '🎮', cost: 2.00, current: 214, max: 280, speed: 1.45, scores: [] },
        { id: 'dyson', name: 'Dyson Airwrap i.d.™', value: 'Valeur : 549 €', tag: '✨ Viral', icon: '💇‍♀️', cost: 2.50, current: 189, max: 270, speed: 1.50, scores: [] },
        { id: 'amazon500', name: 'Carte Cadeau Amazon 500 €', value: 'Pouvoir d’achat immédiat', tag: '⚡ Presque plein !', icon: '🎁', cost: 2.00, current: 299, max: 300, speed: 1.55, scores: [] }
    ];

    let activePrizeId = 'iphone17', userBalance = 50.00, isPlaying = false, position = 0, direction = 1, animationId = null, startTime = 0;
    let selectedAmount = 20, selectedBonus = 2, selectedMethod = 'paypal', freeCodeUsed = false;
    let sbClient = null;

    const prizesGrid = document.getElementById('prizes-grid');
    const balanceEl = document.getElementById('user-balance');
    const cursorEl = document.getElementById('cursor');
    const actionBtn = document.getElementById('action-btn');
    const resultBox = document.getElementById('result-box');
    const leaderboardList = document.getElementById('leaderboard-list');
    const winnerBanner = document.getElementById('winner-banner');
    const liveChronoEl = document.getElementById('live-chrono');
    const recordDisplayEl = document.getElementById('record-display');
    const dbStatusEl = document.getElementById('db-status');
    const playerNameInput = document.getElementById('player-name-input');

    function getPlayerName() { return playerNameInput.value.trim() || 'Joueur_1'; }
    function sortScores(arr) { return arr.sort((a, b) => Math.abs(a.diff - b.diff) > 0.00001 ? a.diff - b.diff : a.time - b.time); }
    function getActivePrize() { return prizes.find(p => p.id === activePrizeId) || prizes[0]; }

    async function loadDataFromSupabase() {
        try {
            if (!window.supabase) {
                dbStatusEl.textContent = '❌ Librairie Supabase bloquée (désactivez bloqueur de pub)';
                renderPrizes(); updateArena(); return;
            }

            sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const timeoutPromise = new Promise((_, reject) =>
                setTimeout(() => reject(new Error('Délai dépassé (5s) — vérifiez URL/clé')), 5000)
            );

            const fetchPromise = Promise.all([
                sbClient.from('competitions').select('*'),
                sbClient.from('scores').select('*')
            ]);

            const [compRes, scoreRes] = await Promise.race([fetchPromise, timeoutPromise]);

            if (compRes.error || scoreRes.error) {
                const err = compRes.error || scoreRes.error;
                dbStatusEl.textContent = '❌ Supabase : ' + err.message;
                renderPrizes(); updateArena(); return;
            }

            if (compRes.data && compRes.data.length > 0) {
                const orderMap = { iphone17: 1, ps5pro: 2, switch2: 3, dyson: 4, amazon500: 5 };
                compRes.data.sort((a, b) => (orderMap[a.id] || 99) - (orderMap[b.id] || 99));
                prizes = compRes.data.map(c => {
                    const compScores = (scoreRes.data || [])
                        .filter(s => s.competition_id === c.id)
                        .map(s => ({ player: s.player_name, diff: Number(s.diff), time: Number(s.reaction_time) }));
                    sortScores(compScores);
                    return {
                        id: c.id,
                        name: c.name,
                        value: c.prize_value,
                        tag: c.tag,
                        icon: c.icon,
                        cost: Number(c.cost),
                        current: Number(c.current_entries),
                        max: Number(c.max_entries),
                        speed: Number(c.speed),
                        scores: compScores
                    };
                });
            }

            dbStatusEl.textContent = '🟢 Connecté à Supabase (Temps réel)';
            renderPrizes();
            updateArena();
        } catch (e) {
            dbStatusEl.textContent = '❌ Erreur : ' + e.message;
            renderPrizes();
            updateArena();
        }
    }

    function renderPrizes() {
        prizesGrid.innerHTML = '';
        prizes.forEach(prize => {
            const pct = Math.min(100, (prize.current / prize.max) * 100);
            const isFull = prize.current >= prize.max;
            const card = document.createElement('div');
            card.className = `prize-card ${prize.id === activePrizeId ? 'active' : ''}`;
            card.onclick = () => selectPrize(prize.id);
            card.innerHTML = `<div class="hot-tag">${isFull ? '✅ TERMINÉ' : prize.tag}</div><div class="entry-badge">${prize.cost.toFixed(2)} €</div><div><div class="prize-icon">${prize.icon}</div><div class="prize-title">${prize.name}</div><div class="prize-value">${prize.value}</div></div><div><div class="progress-container"><div class="progress-bar" style="width:${pct}%;${isFull ? 'background:#ff3366;' : ''}"></div></div><div class="progress-stats"><span>${isFull ? 'Clôturé' : 'En cours'}</span><strong>${prize.current} / ${prize.max}</strong></div></div>`;
            prizesGrid.appendChild(card);
        });
    }

    function selectPrize(id) {
        if (isPlaying) return;
        activePrizeId = id; position = 0; cursorEl.style.left = '0%'; liveChronoEl.textContent = '0.000 s';
        updateArena(); renderPrizes();
    }

    async function relaunchCurrentPrize() {
        if (isPlaying) return;
        const prize = getActivePrize();
        prize.current = 0; prize.scores = []; prize.tag = '🆕 Nouvelle session';
        if (sbClient) {
            await sbClient.from('scores').delete().eq('competition_id', prize.id);
            await sbClient.from('competitions').update({ current_entries: 0, tag: '🆕 Nouvelle session' }).eq('id', prize.id);
        }
        position = 0; cursorEl.style.left = '0%'; liveChronoEl.textContent = '0.000 s';
        renderPrizes(); updateArena();
    }

    function updateArena() {
        const prize = getActivePrize();
        sortScores(prize.scores);
        const isFull = prize.current >= prize.max;
        const currentPlayer = getPlayerName();
        document.getElementById('active-prize-name').textContent = `${prize.icon} ${prize.name}`;
        document.getElementById('active-prize-sub').textContent = `Mise : ${prize.cost.toFixed(2)} € • Palier : ${prize.max} participations`;
        const statusPill = document.getElementById('session-status');
        statusPill.textContent = isFull ? `CLÔTURÉ (${prize.current}/${prize.max})` : `EN COURS (${prize.current}/${prize.max})`;
        statusPill.className = `status-pill ${isFull ? 'closed' : ''}`;
        recordDisplayEl.textContent = prize.scores.length ? `${prize.scores[0].diff.toFixed(3)}% (${prize.scores[0].time.toFixed(3)}s)` : 'Aucun score';
        if (isFull) {
            actionBtn.disabled = true; actionBtn.textContent = 'Session terminée'; actionBtn.className = 'btn-play';
            const winner = prize.scores[0] || { player: 'Aucun joueur', diff: 0, time: 0 };
            winnerBanner.classList.add('show');
            document.getElementById('winner-announcement').innerHTML = `<strong>${winner.player}</strong> remporte <strong>${prize.name}</strong> (${winner.diff.toFixed(3)}% en ${winner.time.toFixed(3)}s) !`;
            document.getElementById('relaunch-btn').textContent = `🔄 Relancer une nouvelle session (0/${prize.max})`;
        } else {
            actionBtn.disabled = false; actionBtn.textContent = `Miser ${prize.cost.toFixed(2)} € et Jouer`; actionBtn.className = 'btn-play';
            winnerBanner.classList.remove('show');
        }
        leaderboardList.innerHTML = prize.scores.length ? '' : '<li style="text-align:center;color:var(--text-muted);padding:20px;">Aucune participation enregistrée.</li>';
        prize.scores.forEach((entry, index) => {
            const li = document.createElement('li');
            li.className = `leaderboard-item ${index === 0 ? 'top-1' : ''}`;
            const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
            li.innerHTML = `<div class="player-info"><span class="rank">${medal}</span><span><strong>${entry.player}</strong> ${entry.player === currentPlayer ? '(Moi)' : ''}</span></div><div class="score-details"><span class="score-val">Écart : ${entry.diff.toFixed(3)}%</span><span class="time-val">⏱️ ${entry.time.toFixed(3)} s</span></div>`;
            leaderboardList.appendChild(li);
        });
    }

    function animateCursor(now) {
        if (!isPlaying) return;
        const prize = getActivePrize();
        liveChronoEl.textContent = `${((now - startTime) / 1000).toFixed(3)} s`;
        position += prize.speed * direction;
        if (position >= 100) { position = 100; direction = -1; } else if (position <= 0) { position = 0; direction = 1; }
        cursorEl.style.left = position + '%';
        animationId = requestAnimationFrame(animateCursor);
    }

    async function handleGameAction() {
        const prize = getActivePrize();
        const currentPlayer = getPlayerName();
        if (!isPlaying) {
            if (prize.current >= prize.max || userBalance < prize.cost) return;
            userBalance -= prize.cost; balanceEl.textContent = userBalance.toFixed(2) + ' €';
            isPlaying = true; position = 0; direction = 1; startTime = performance.now();
            actionBtn.textContent = 'STOP ! (Cliquez pour figer)'; actionBtn.classList.add('stop-mode');
            animationId = requestAnimationFrame(animateCursor);
        } else {
            isPlaying = false; cancelAnimationFrame(animationId);
            const reactionTime = parseFloat(((performance.now() - startTime) / 1000).toFixed(3));
            liveChronoEl.textContent = `${reactionTime.toFixed(3)} s`;
            const diff = parseFloat(Math.abs(50 - position).toFixed(3));
            const nextCount = prize.current + 1;
            prize.current = nextCount; prize.scores.push({ player: currentPlayer, diff, time: reactionTime });
            sortScores(prize.scores);
            if (sbClient) {
                await sbClient.from('scores').insert({ competition_id: prize.id, player_name: currentPlayer, diff, reaction_time: reactionTime });
                await sbClient.from('competitions').update({ current_entries: nextCount }).eq('id', prize.id);
            }
            resultBox.innerHTML = `Écart : <strong>${diff.toFixed(3)}%</strong> • Temps : <strong>${reactionTime.toFixed(3)} s</strong>`;
            renderPrizes(); updateArena();
        }
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function selectAmount(amount, bonus, el) { selectedAmount = amount; selectedBonus = bonus; document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected')); el.classList.add('selected'); updatePayButtonText(); }
    function selectMethod(method, el) { selectedMethod = method; document.querySelectorAll('.method-card').forEach(c => c.classList.remove('selected')); el.classList.add('selected'); updatePayButtonText(); }
    function updatePayButtonText() {
        const btn = document.getElementById('confirm-pay-btn');
        const bonusTxt = selectedBonus > 0 ? ` (+${selectedBonus.toFixed(2)} € offerts)` : '';
        btn.className = selectedMethod === 'paypal' ? 'btn-confirm-pay paypal-style' : 'btn-confirm-pay';
        btn.textContent = `Payer ${selectedAmount.toFixed(2)} €${bonusTxt}`;
    }
    function claimFreeCredit() {
        if (freeCodeUsed) return;
        const val = document.getElementById('promo-code-input').value.trim().toUpperCase();
        if (val === 'SKILL5' || val === 'GRATUIT') {
            freeCodeUsed = true; userBalance += 5.00; balanceEl.textContent = userBalance.toFixed(2) + ' €';
            document.getElementById('promo-feedback').innerHTML = '<span style="color:var(--accent);">✅ +5.00 € gratuits ajoutés !</span>';
        }
    }
    function processPayment() {
        userBalance += selectedAmount + selectedBonus; balanceEl.textContent = userBalance.toFixed(2) + ' €';
        closeModal('payment-modal');
    }

    loadDataFromSupabase();
</script>
</body>
</html>
