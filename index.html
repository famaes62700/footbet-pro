<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foot-Turf</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Foot-Turf">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 flex flex-col h-screen overflow-hidden font-sans select-none">
    
    <!-- BARRE DE NAVIGATION COMMUNE (MENU) -->
    <nav class="bg-zinc-900 border-b border-zinc-800 p-2.5 z-50 shadow-lg flex justify-center space-x-2 sm:space-x-3 overflow-x-auto whitespace-nowrap">
        <button onclick="switchApp('foot.html', this)" class="nav-btn bg-zinc-950 text-white border-emerald-500 px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border shadow-inner">
            <i class="fa-solid fa-futbol mr-2 text-emerald-500"></i> FootBet Pro
        </button>
        <button onclick="switchApp('turf.html', this)" class="nav-btn bg-zinc-800 text-zinc-400 hover:text-white px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border border-zinc-700 shadow">
            <i class="fa-solid fa-horse-head mr-2 text-emerald-500"></i> Fab Turf
        </button>
        <button onclick="switchApp('nba.html', this)" class="nav-btn bg-zinc-800 text-zinc-400 hover:text-white px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border border-zinc-700 shadow">
            <i class="fa-solid fa-basketball mr-2 text-orange-500"></i> NBA Direct
        </button>
    </nav>

    <!-- ECRAN D'AFFICHAGE INTERNE -->
    <iframe id="appFrame" src="foot.html" class="flex-grow w-full border-none bg-zinc-950"></iframe>

    <script>
        function switchApp(page, btn) {
            document.getElementById('appFrame').src = page;
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.className = "nav-btn bg-zinc-800 text-zinc-400 hover:text-white px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border border-zinc-700 shadow";
            });
            
            let borderColor = page === 'nba.html' ? 'border-orange-500' : 'border-emerald-500';
            btn.className = `nav-btn bg-zinc-950 text-white ${borderColor} px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center border shadow-inner`;
        }
    </script>
</body>
</html>
