<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootBet Pro - Live & Proportionnelle</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-emerald-500 flex items-center">
                <i class="fa-solid fa-futbol mr-2"></i>FootBet Pro
            </h1>
            <div class="flex items-center space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-emerald-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-emerald-500" onchange="loadFootMatches()">
                <button onclick="toggleHistoryStats()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 font-bold transition flex items-center shadow relative">
                    <i class="fa-solid fa-calendar-days"></i>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-fire mr-1.5"></i> En Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-emerald-500 flex-grow">
                <option value="ALL">Tous les championnats</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-emerald-400 font-mono flex items-center">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Recherche des matchs...
            </div>
            <button onclick="loadFootMatches(false)" class="text-zinc-400 hover:text-emerald-400 transition" title="Actualiser">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <div id="historyBlock" class="hidden bg-zinc-900 border border-emerald-500/30 rounded-2xl p-4 shadow-xl mb-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase text-zinc-300 tracking-wider flex items-center">
                    <i class="fa-solid fa-vault mr-1.5 text-emerald-400"></i> Vos Gains Cumulés Foot
                </h2>
                <button onclick="toggleHistoryStats()" class="text-zinc-500 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Semaine en cours</h3>
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-zinc-400">Bénéfice Net :</span>
                        <span id="weekProfit" class="text-emerald-400">-- €</span>
                    </div>
                </div>
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Mois par Mois (<span id="currentYearText"></span>)</h3>
                    <div id="monthsGrid" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-emerald-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-emerald-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-zinc-400 uppercase">Matchs pariés</div>
                <div id="dailyBetsCount" class="text-sm font-bold text-zinc-300">0</div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between items-center text-xs text-zinc-300 shadow-md">
            <span><i class="fa-solid fa-wallet mr-1.5 text-emerald-400"></i> Total Mises (Foot) :</span>
            <span id="totalSpentText" class="font-bold text-white">0.00 €</span>
        </div>

        <div id="matchesContainer" class="space-y-3">
            <!-- Rempli dynamiquement -->
        </div>

    </main>

    <script>
        const FOOTBALL_API_KEY = "c42660750d784a43b51eb6a31906a777"; 

        document.getElementById('matchDate').valueAsDate = new Date();
        let currentMatches = [];
        let isLiveFilterActive = false;

        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02; 

        setInterval(() => {
            let today = new Date().toISOString().split('T')[0];
            let selectedDate = document.getElementById('matchDate').value;
            if (selectedDate === today || isLiveFilterActive) {
                loadFootMatches(true);
            }
        }, 30000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-emerald-900/90 border-emerald-500/50 text-emerald-200' : 'bg-zinc-800 border-zinc-700 text-white';
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadFootMatches(isSilent = false) {
            const dateInput = document.getElementById('matchDate').value;
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Recherche des matchs...';
                document.getElementById('matchesContainer').innerHTML = '';
            }
            
            try {
                const res = await fetch(`/api/football/matches?date=${dateInput}`, {
                    headers: { 'X-Auth-Token': FOOTBALL_API_KEY }
                });
                
                if (!res.ok) throw new Error("Erreur réseau API");
                const data = await res.json();
                
                currentMatches = data.matches || [];
                
                if (currentMatches.length === 0) {
                    statusText.innerHTML = `<span class="text-zinc-400">Aucun match majeur ce jour.</span>`;
                    populateCompetitions([]);
                    calculateDailyBankroll();
                    return;
                }

                if (!isSilent) {
                    statusText.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentMatches.length} matchs trouvés</span>`;
                }
                
                populateCompetitions(currentMatches);
                applyFilters();
                calculateDailyBankroll();

            } catch (e) {
                if (!isSilent) {
                    statusText.innerHTML = '<span class="text-red-400 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Erreur Connexion Foot</span>';
                }
            }
        }

        function populateCompetitions(matches) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            
            if (select.options.length > 1 && document.activeElement === select) return;

            select.innerHTML = '<option value="ALL">Tous les championnats</option>';
            const comps = new Set();
            
            matches.forEach(m => {
                if(m.competition && m.competition.name) comps.add(m.competition.name);
            });
            
            Array.from(comps).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });

            if (Array.from(comps).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if(isLiveFilterActive) {
                btn.classList.replace('bg-red-900/40', 'bg-red-600');
                btn.classList.replace('text-red-400', 'text-white');
            } else {
                btn.classList.replace('bg-red-600', 'bg-red-900/40');
                btn.classList.replace('text-white', 'text-red-400');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentMatches;
            if (isLiveFilterActive) filtered = filtered.filter(m => m.status === 'IN_PLAY' || m.status === 'PAUSED');
            
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(m => m.competition && m.competition.name === selectedComp);
            
            renderMatches(filtered);
        }

        function computeAlgoPick(hName, aName, hId, aId) {
            hName = String(hName || "");
            aName = String(aName || "");
            
            const powerHouses = [
                "Real Madrid", "Barcelona", "Atletico", "Girona",
                "Man City", "Manchester City", "Arsenal", "Liverpool", "Chelsea", "Tottenham", "Aston Villa",
                "Bayern", "Leverkusen", "Dortmund", "Leipzig",
                "Paris", "PSG", "Monaco", "Marseille", "Lille",
                "Inter", "Juventus", "Milan", "Napoli", "Atalanta",
                "Sporting", "Benfica", "Porto", "PSV"
            ];
            
            let hForce = 55; 
            let aForce = 35; 
            
            powerHouses.forEach(p => {
                if(hName.includes(p)) hForce += 45;
                if(aName.includes(p)) aForce += 50; 
            });
            
            let hForm = (hId || hName.length) % 15;
            let aForm = (aId || aName.length) % 15;
            
            hForce += hForm;
            aForce += aForm;
            
            let diff = hForce - aForce;
            if (diff > 14) return 'HOME';
            if (diff < -8) return 'AWAY';
            return 'DRAW';
        }

        function renderMatches(matchesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`footbet_${dateStr}`)) || {};

            container.innerHTML = '';

            if (matchesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucun match ne correspond à vos filtres.</div>`;
                return;
            }

            matchesToRender.forEach(match => {
                let status = match.status; 
                let isFinished = status === 'FINISHED' || status === 'AWARDED';
                let isLive = status === 'IN_PLAY' || status === 'PAUSED';
                
                let time = new Date(match.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                
                // Sécurisation des noms d'équipes
                let home = match.homeTeam || {};
                let away = match.awayTeam || {};
                let homeName = home.name || "Équipe 1";
                let awayName = away.name || "Équipe 2";
                let homeShort = home.shortName || homeName;
                let awayShort = away.shortName || awayName;
                
                let sHome = match.score?.fullTime?.home ?? (match.score?.current?.home ?? "-");
                let sAway = match.score?.fullTime?.away ?? (match.score?.current?.away ?? "-");

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${time}</span>`;
                if (isLive) {
                    let liveMinute = match.minute ? `${match.minute}'` : 'En direct';
                    statusBadge = `<span class="bg-red-900/50 text-red-400 border border-red-500/30 px-2 py-0.5 rounded text-[10px] uppercase font-bold animate-pulse">${liveMinute}</span>`;
                }
                if (isFinished) statusBadge = `<span class="bg-zinc-800 text-zinc-500 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Terminé</span>`;

                let flagImg = match.area?.flag ? `<img src="${match.area.flag}" class="w-4 h-3 object-cover rounded-[2px] opacity-90 inline-block mr-1.5 shadow-sm">` : '';

                let winner = null;
                if (isFinished) {
                    if (sHome > sAway) winner = 'HOME';
                    else if (sAway > sHome) winner = 'AWAY';
                    else winner = 'DRAW';
                }

                let myBet = savedBets[match.id]; 

                let algoPick = computeAlgoPick(homeName, awayName, home.id, away.id);
                let badgeHTML = `<div class="absolute -top-2.5 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow-lg border border-indigo-400 z-10 whitespace-nowrap"><i class="fa-solid fa-robot mr-0.5"></i> ALGO</div>`;
                
                let homeBadge = algoPick === 'HOME' ? badgeHTML : '';
                let drawBadge = algoPick === 'DRAW' ? badgeHTML : '';
                let awayBadge = algoPick === 'AWAY' ? badgeHTML : '';

                let card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-md";
                
                let compName = match.competition?.name || "Compétition";

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800/50 pb-2 mb-3">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center">${flagImg}${compName}</span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <button onclick="placeBet('${match.id}', 'HOME')" 
                                class="relative flex flex-col items-center justify-center p-2 rounded-xl border transition ${myBet === 'HOME' ? 'bg-emerald-900/30 border-emerald-500 text-white' : 'bg-zinc-800/50 border-zinc-700/50 text-zinc-400 hover:bg-zinc-800'}">
                            ${homeBadge}
                            <span class="text-[11px] font-black text-center leading-tight mb-1 line-clamp-1 w-full text-amber-400 drop-shadow-md">${homeShort}</span>
                            <span class="text-lg font-black ${isFinished && winner === 'HOME' ? 'text-emerald-400' : 'text-white'}">${sHome}</span>
                        </button>

                        <button onclick="placeBet('${match.id}', 'DRAW')" 
                                class="relative flex flex-col items-center justify-center p-2 rounded-xl border transition ${myBet === 'DRAW' ? 'bg-emerald-900/30 border-emerald-500 text-white' : 'bg-zinc-800/50 border-zinc-700/50 text-zinc-500 hover:bg-zinc-800'}">
                            ${drawBadge}
                            <span class="text-[11px] font-black text-center mb-1 text-emerald-400 drop-shadow-md">NUL</span>
                            <span class="text-xs font-black ${isFinished && winner === 'DRAW' ? 'text-emerald-400' : 'text-zinc-600'}">-</span>
                        </button>

                        <button onclick="placeBet('${match.id}', 'AWAY')" 
                                class="relative flex flex-col items-center justify-center p-2 rounded-xl border transition ${myBet === 'AWAY' ? 'bg-emerald-900/30 border-emerald-500 text-white' : 'bg-zinc-800/50 border-zinc-700/50 text-zinc-400 hover:bg-zinc-800'}">
                            ${awayBadge}
                            <span class="text-[11px] font-black text-center leading-tight mb-1 line-clamp-1 w-full text-sky-400 drop-shadow-md">${awayShort}</span>
                            <span class="text-lg font-black ${isFinished && winner === 'AWAY' ? 'text-emerald-400' : 'text-white'}">${sAway}</span>
                        </button>
                    </div>
                    
                    ${myBet ? `
                    <div class="mt-2 text-center text-[10px] bg-zinc-950 rounded py-1 border border-zinc-800">
                        ${isFinished 
                            ? (myBet === winner ? '<span class="text-emerald-400 font-bold"><i class="fa-solid fa-check"></i> Gagné</span>' : '<span class="text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Perdu</span>') 
                            : '<span class="text-emerald-400">Pari 1N2 enregistré (Mise dynamique)</span>'
                        }
                    </div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function placeBet(matchId, pick) {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`footbet_${dateStr}`)) || {};
            
            if(savedBets[matchId] === pick) {
                delete savedBets[matchId];
                showToast("Pari annulé");
            } else {
                savedBets[matchId] = pick;
                showToast("Pari foot validé", "success");
            }
            
            localStorage.setItem(`footbet_${dateStr}`, JSON.stringify(savedBets));
            applyFilters();
            calculateDailyBankroll();
        }

        function calculateDailyBankroll() {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`footbet_${dateStr}`)) || {};
            
            let dailyProfit = 0;
            let betsCount = 0;
            let totalSpent = 0;
            let currentBankroll = INITIAL_BANKROLL;
            let assumedOdds = 1.90; 

            currentMatches.forEach(match => {
                let status = match.status;
                let isFinished = status === 'FINISHED' || status === 'AWARDED';
                let myBet = savedBets[match.id];

                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);
                    totalSpent += currentStake;

                    if (isFinished) {
                        let sHome = match.score?.fullTime?.home ?? 0;
                        let sAway = match.score?.fullTime?.away ?? 0;
                        let winner = sHome > sAway ? 'HOME' : (sAway > sHome ? 'AWAY' : 'DRAW');
                        
                        let netMatch = 0;
                        if (myBet === winner) {
                            netMatch = (assumedOdds * currentStake) - currentStake;
                            dailyProfit += netMatch;
                        } else {
                            netMatch = -currentStake;
                            dailyProfit -= currentStake;
                        }
                        currentBankroll += netMatch;
                    }
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-emerald-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;

            document.getElementById('totalSpentText').textContent = `${totalSpent.toFixed(2)} €`;
            document.getElementById('headerBankroll').textContent = `${currentBankroll.toFixed(2)} €`;

            let globalStats = JSON.parse(localStorage.getItem('footbet_history')) || {};
            globalStats[dateStr] = dailyProfit;
            localStorage.setItem('footbet_history', JSON.stringify(globalStats));

            if (!document.getElementById('historyBlock').classList.contains('hidden')) {
                showHistoryStats();
            }
        }

        function toggleHistoryStats() {
            let block = document.getElementById('historyBlock');
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                showHistoryStats();
            } else {
                block.classList.add('hidden');
            }
        }

        function showHistoryStats() {
            let dateInput = document.getElementById('matchDate').value;
            let currentViewDate = dateInput ? new Date(dateInput) : new Date();
            let year = currentViewDate.getFullYear();
            
            document.getElementById('currentYearText').textContent = year;
            let globalStats = JSON.parse(localStorage.getItem('footbet_history')) || {};

            let dayOfWeek = currentViewDate.getDay() || 7; 
            let monday = new Date(currentViewDate);
            monday.setDate(currentViewDate.getDate() - (dayOfWeek - 1)); 
            
            let weekProfit = 0;
            for(let i=0; i<7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                let dStr = d.toISOString().split('T')[0];
                weekProfit += globalStats[dStr] || 0;
            }
            
            let wpEl = document.getElementById('weekProfit');
            wpEl.textContent = `${weekProfit > 0 ? '+' : ''}${weekProfit.toFixed(2)} €`;
            wpEl.className = weekProfit > 0 ? 'text-emerald-400 font-bold' : (weekProfit < 0 ? 'text-red-400 font-bold' : 'text-zinc-500');

            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
            let monthsGrid = document.getElementById('monthsGrid');
            monthsGrid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                let mProfit = 0;
                let daysInMonth = new Date(year, m + 1, 0).getDate(); 
                
                for (let d = 1; d <= daysInMonth; d++) {
                    let dateObj = new Date(year, m, d);
                    let dStr = dateObj.toISOString().split('T')[0];
                    mProfit += globalStats[dStr] || 0;
                }

                if (mProfit !== 0) {
                    let div = document.createElement('div');
                    let isCurrentViewMonth = (m === currentViewDate.getMonth());
                    div.className = isCurrentViewMonth 
                        ? "bg-zinc-800 p-3 rounded-xl border border-emerald-500/50 mb-2 flex justify-between items-center" 
                        : "bg-zinc-800/50 p-3 rounded-xl border border-zinc-700/50 mb-2 flex justify-between items-center";

                    let colorCls = mProfit > 0 ? 'text-emerald-400' : 'text-red-400';
                    div.innerHTML = `
                        <span class="font-bold text-sm ${isCurrentViewMonth ? 'text-emerald-400' : 'text-zinc-300'}">${monthNames[m]}</span>
                        <span class="font-black ${colorCls}">${mProfit > 0 ? '+' : ''}${mProfit.toFixed(2)} €</span>
                    `;
                    monthsGrid.appendChild(div);
                }
            }
            if(monthsGrid.innerHTML === '') {
                monthsGrid.innerHTML = '<div class="text-zinc-500 text-center text-xs py-2">Aucune donnée Football pour cette année.</div>';
            }
        }

        window.onload = loadFootMatches;
    </script>
</body>
</html>
