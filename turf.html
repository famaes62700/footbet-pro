<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootBet Pro - Europe (Anti-Défilement)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-blue-400 flex items-center">
                <i class="fa-solid fa-futbol mr-2 text-blue-500"></i>FootBet Pro <span class="text-[10px] ml-2 bg-blue-900/40 text-blue-300 border border-blue-500/30 px-1.5 py-0.5 rounded">Pro V3</span>
            </h1>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-blue-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-blue-500" onchange="loadFootballMatches(false)">
                <button onclick="toggleHistoryStats()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 font-bold transition flex items-center shadow relative" title="Historique Semaine & Mois">
                    <i class="fa-solid fa-calendar-days text-blue-400"></i>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-fire mr-1.5"></i> En Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-blue-500 flex-grow">
                <option value="ALL">Toutes les Compétitions</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-blue-400 font-mono flex items-center w-3/4 truncate">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement global des scores...
            </div>
            <button onclick="loadFootballMatches(false)" class="bg-zinc-800 hover:bg-zinc-700 text-blue-400 px-3 py-1.5 rounded-lg border border-blue-500/30 text-xs font-bold transition flex items-center shadow">
                <i class="fa-solid fa-rotate mr-1.5"></i> Actualiser
            </button>
        </div>

        <!-- HISTORIQUE CUMULÉ SEMAINE & MOIS -->
        <div id="historyBlock" class="hidden bg-zinc-900 border border-blue-500/30 rounded-2xl p-4 shadow-xl mb-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase text-zinc-300 tracking-wider flex items-center">
                    <i class="fa-solid fa-vault mr-1.5 text-blue-400"></i> Vos Gains Cumulés
                </h2>
                <button onclick="toggleHistoryStats()" class="text-zinc-500 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700 text-xs">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Semaine en cours</h3>
                    <div class="flex justify-between font-black"><span class="text-white">BÉNÉFICE NET :</span><span id="weekTotal" class="text-blue-400">0.00 €</span></div>
                </div>
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Mois par Mois (<span id="currentYearText"></span>)</h3>
                    <div id="monthsGrid" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <!-- BILAN DU JOUR & TOTAL MISES -->
        <div class="bg-zinc-900 border border-blue-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-blue-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right space-y-0.5">
                <div class="text-[10px] text-zinc-400 uppercase">Matchs pariés: <strong id="dailyBetsCount" class="text-white">0</strong></div>
                <div class="text-[10px] text-zinc-400 uppercase">Total Mises: <strong id="dailyTotalStake" class="text-blue-400">0.00 €</strong></div>
            </div>
        </div>

        <div id="matchesContainer" class="space-y-3"></div>

    </main>

    <script>
        function getLocalYYYYMMDD(d) {
            const yr = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const da = String(d.getDate()).padStart(2, '0');
            return `${yr}${mo}${da}`;
        }

        const todayInputStr = new Date().toISOString().split('T')[0];
        document.getElementById('matchDate').value = todayInputStr;

        let currentMatches = [];
        let isLiveFilterActive = false;
        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02;

        const topTeams = {
            "Real Madrid": 95, "Manchester City": 95, "Bayern Munich": 94, "Liverpool": 93, "Arsenal": 92, "Barcelona": 92,
            "Paris Saint-Germain": 90, "Inter Milan": 90, "Bayer Leverkusen": 88, "Borussia Dortmund": 85,
            "Juventus": 85, "AC Milan": 85, "Atletico Madrid": 85, "Napoli": 84, "Chelsea": 83, "Tottenham": 83, 
            "Aston Villa": 82, "Marseille": 80, "Monaco": 80, "Lille": 78, "Lens": 75, "Lyon": 75,
            "Sporting CP": 82, "Benfica": 80, "FC Porto": 80, "PSV Eindhoven": 78, "Atalanta": 82, "RB Leipzig": 82
        };

        function getTeamScorePower(teamName) {
            let baseScore = 60;
            for (let t in topTeams) {
                if (teamName.includes(t)) {
                    baseScore = topTeams[t];
                    break;
                }
            }
            return baseScore;
        }

        function getAlgoPick(homeName, awayName) {
            let hScore = getTeamScorePower(homeName) + 8;
            let aScore = getTeamScorePower(awayName);
            let diff = hScore - aScore;

            if (diff >= 12) return 'HOME';
            if (diff <= -8) return 'AWAY';
            return (hScore > aScore) ? 'HOME' : 'DRAW';
        }

        function parseScoreDeep(competitor) {
            if (!competitor) return 0;
            let s = competitor.score;
            if (s !== undefined && s !== null && s !== "") {
                if (typeof s === 'number') return s;
                let parsed = parseInt(typeof s === 'object' ? (s.value !== undefined ? s.value : s.displayValue) : String(s).trim(), 10);
                if (!isNaN(parsed)) return parsed;
            }
            if (Array.isArray(competitor.linescores) && competitor.linescores.length > 0) {
                let sum = 0;
                let found = false;
                competitor.linescores.forEach(ls => {
                    let v = parseInt(ls.value !== undefined ? ls.value : ls.displayValue, 10);
                    if (!isNaN(v)) {
                        sum += v;
                        found = true;
                    }
                });
                if (found) return sum;
            }
            return 0;
        }

        // Rafraîchissement silencieux en arrière-plan toutes les 15s (ne reconstruit PAS la liste si elle est déjà affichée)
        setInterval(() => {
            if (document.getElementById('matchDate').value === new Date().toISOString().split('T')[0] || isLiveFilterActive) {
                loadFootballMatches(true);
            }
        }, 15000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-blue-900/90 border-blue-500/50 text-blue-200' : (type === 'error' ? 'bg-red-900/90 border-red-500/50 text-red-200' : 'bg-zinc-800 border-zinc-700 text-white');
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleHistoryStats() {
            let block = document.getElementById('historyBlock');
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                showHistoryStats();
            } else {
                block.classList.add('hidden');
            }
        }

        async function loadFootballMatches(isSilent = false) {
            const dateInputVal = document.getElementById('matchDate').value;
            const apiDate = dateInputVal.replace(/-/g, '');
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Chargement global des scores...';
            }
            
            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${apiDate}`, { cache: 'no-store' });
                if (!res.ok) throw new Error("Erreur réseau");
                const data = await res.json();

                let validMatches = [];
                let events = data.events || [];

                const dateStrStorage = document.getElementById('matchDate').value;
                let manualScores = JSON.parse(localStorage.getItem(`foot_manual_scores_${dateStrStorage}`)) || {};

                events.forEach(event => {
                    let comp = event.competitions?.[0];
                    if (!comp || !comp.competitors || comp.competitors.length < 2) return;

                    let matchDateIso = event.date ? event.date.split('T')[0] : '';
                    let statusObj = comp.status || event.status || {};
                    let statusType = statusObj.type || {};
                    const state = String(statusType.state || 'pre').toLowerCase();
                    const isCompleted = Boolean(statusType.completed || state === 'post');
                    const isLive = (state === 'in');

                    if (matchDateIso !== dateInputVal && !isLive) return;

                    let home = comp.competitors.find(c => String(c.homeAway).toLowerCase() === 'home') || comp.competitors[0];
                    let away = comp.competitors.find(c => String(c.homeAway).toLowerCase() === 'away') || comp.competitors[1];

                    let homeName = home.team?.shortDisplayName || home.team?.name || home.team?.displayName || "Domicile";
                    let awayName = away.team?.shortDisplayName || away.team?.name || away.team?.displayName || "Extérieur";
                    let homeLogo = home.team?.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(homeName)}&background=18181b&color=60a5fa&size=64`;
                    let awayLogo = away.team?.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(awayName)}&background=18181b&color=60a5fa&size=64`;

                    let status = isLive ? 'IN_PLAY' : (isCompleted ? 'FINISHED' : 'TIMED');
                    
                    let ptsHome = parseScoreDeep(home);
                    let ptsAway = parseScoreDeep(away);

                    if (manualScores[event.id] && manualScores[event.id].home !== undefined) {
                        ptsHome = manualScores[event.id].home;
                        ptsAway = manualScores[event.id].away;
                        if (status === 'TIMED') status = 'FINISHED';
                    }

                    let sHomeDisplay = (status === 'TIMED') ? '-' : String(ptsHome);
                    let sAwayDisplay = (status === 'TIMED') ? '-' : String(ptsAway);

                    let winner = null;
                    if (isCompleted || (manualScores[event.id])) {
                        if (ptsHome > ptsAway) winner = 'HOME';
                        else if (ptsAway > ptsHome) winner = 'AWAY';
                        else winner = 'DRAW';
                        if (status === 'TIMED') status = 'FINISHED';
                    }

                    let leagueName = event.season?.slug || comp.tournament?.name || data.leagues?.[0]?.name || "Football";
                    if (typeof leagueName === 'string') {
                        leagueName = leagueName.toUpperCase();
                    } else {
                        leagueName = "FOOTBALL EUROPÉEN";
                    }

                    let detailClock = statusObj.displayClock || statusType.shortDetail || "En cours";

                    validMatches.push({
                        id: String(event.id),
                        status: status,
                        statusDetail: detailClock,
                        utcDate: event.date,
                        competition: { name: leagueName },
                        homeTeam: { name: homeName, logo: homeLogo, score: sHomeDisplay, numScore: ptsHome },
                        awayTeam: { name: awayName, logo: awayLogo, score: sAwayDisplay, numScore: ptsAway },
                        winner: winner
                    });
                });

                validMatches.sort((a, b) => {
                    if (a.status === 'IN_PLAY' && b.status !== 'IN_PLAY') return -1;
                    if (b.status === 'IN_PLAY' && a.status !== 'IN_PLAY') return 1;
                    return new Date(a.utcDate) - new Date(b.utcDate);
                });

                currentMatches = validMatches;

                if (currentMatches.length === 0) {
                    statusText.innerHTML = `<span class="text-zinc-400">Aucun match trouvé pour cette date.</span>`;
                } else {
                    const liveCount = currentMatches.filter(m => m.status === 'IN_PLAY').length;
                    statusText.innerHTML = `<span class="text-blue-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentMatches.length} matchs trouvés (${liveCount} en direct)</span>`;
                }
                
                if (document.getElementById('compSelect').children.length <= 1) {
                    populateCompetitions(currentMatches);
                }
                applyFilters();
                calculateDailyBankroll();

            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span class="text-red-400 font-semibold">Impossible de récupérer les scores.</span>`;
            }
        }

        function populateCompetitions(matches) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            select.innerHTML = '<option value="ALL">Toutes les Compétitions</option>';
            const compsMap = new Map();
            
            matches.forEach(m => {
                if (m.competition?.name) {
                    compsMap.set(m.competition.name, (compsMap.get(m.competition.name) || 0) + 1);
                }
            });
            
            Array.from(compsMap.keys()).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `${c} (${compsMap.get(c)})`;
                select.appendChild(opt);
            });
            
            if (Array.from(compsMap.keys()).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if (isLiveFilterActive) {
                btn.classList.replace('bg-red-900/40', 'bg-red-600');
                btn.classList.replace('text-red-400', 'text-white');
            } else {
                btn.classList.replace('bg-red-600', 'bg-red-900/40');
                btn.classList.replace('text-white', 'text-red-400');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentMatches;
            if (isLiveFilterActive) filtered = filtered.filter(m => m.status === 'IN_PLAY');
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(m => m.competition?.name === selectedComp);
            renderMatches(filtered);
        }

        function renderMatches(matchesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`footbet_pro_v3_${dateStr}`)) || {};

            if (matchesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucun match pour ce filtre.</div>`;
                return;
            }

            let runningBankroll = INITIAL_BANKROLL;
            currentMatches.forEach(m => {
                if (savedBets[m.id]) {
                    let stake = Math.max(0.5, runningBankroll * STAKE_PERCENT);
                    if (m.status === 'FINISHED' && m.winner) {
                        runningBankroll += (savedBets[m.id] === m.winner) ? (0.80 * stake) : -stake;
                    }
                }
            });
            let currentStake = Math.max(0.5, runningBankroll * STAKE_PERCENT);

            // GESTION INTELLIGENTE : Met à jour uniquement les cartes existantes en arrière-plan sans effacer la page
            let existingCardsMap = new Map();
            Array.from(container.children).forEach(child => {
                if (child.dataset && child.dataset.matchId) {
                    existingCardsMap.set(child.dataset.matchId, child);
                }
            });

            let newContainerContent = document.createElement('div');
            newContainerContent.className = "space-y-3";

            matchesToRender.forEach(match => {
                let isFinished = match.status === 'FINISHED';
                let isLive = match.status === 'IN_PLAY';
                
                let homeName = match.homeTeam.name;
                let awayName = match.awayTeam.name;
                let homeLogo = match.homeTeam.logo;
                let awayLogo = match.awayTeam.logo;
                let sHome = match.homeTeam.score;
                let sAway = match.awayTeam.score;

                let algoPrediction = getAlgoPick(homeName, awayName);
                let badgeAlgo = `<span class="mt-1.5 text-[9px] text-white bg-zinc-950/40 px-1.5 py-0.5 rounded font-black tracking-wider"><i class="fa-solid fa-bolt mr-1 text-amber-400"></i>PRONO V3</span>`;

                let timeStr = new Date(match.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-lg text-[10px] uppercase font-bold">${timeStr}</span>`;
                if (isLive) statusBadge = `<span class="bg-red-900/60 text-red-300 border border-red-500/40 px-2.5 py-1 rounded-lg text-[10px] uppercase font-bold animate-pulse">🔴 Direct (${match.statusDetail})</span>`;
                if (isFinished) statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-lg text-[10px] uppercase font-bold">Terminé</span>`;

                let winner = match.winner;
                let myBet = savedBets[match.id]; 

                let baseBtn = "relative flex-1 py-4 px-2 rounded-xl font-bold text-xs transition-all duration-200 border text-center flex flex-col items-center justify-center shadow-sm overflow-hidden ";
                
                let homeClass = baseBtn + (myBet === 'HOME' 
                    ? "bg-blue-600 text-white border-blue-500 shadow-[0_0_12px_rgba(37,99,235,0.6)] scale-[1.02]" 
                    : "bg-blue-900/40 text-blue-300 border-blue-500/40 hover:bg-blue-800/60 hover:text-white");
                    
                let drawClass = baseBtn + (myBet === 'DRAW' 
                    ? "bg-amber-500 text-white border-amber-400 shadow-[0_0_12px_rgba(245,158,11,0.6)] scale-[1.02]" 
                    : "bg-amber-900/40 text-amber-300 border-amber-500/40 hover:bg-amber-800/60 hover:text-white");
                    
                let awayClass = baseBtn + (myBet === 'AWAY' 
                    ? "bg-emerald-600 text-white border-emerald-500 shadow-[0_0_12px_rgba(5,150,105,0.6)] scale-[1.02]" 
                    : "bg-emerald-900/40 text-emerald-300 border-emerald-500/40 hover:bg-emerald-800/60 hover:text-white");

                if (isFinished) {
                    homeClass = baseBtn + (myBet === 'HOME' ? "bg-blue-900/50 text-blue-300 border-blue-800" : "bg-zinc-900 text-zinc-600 border-zinc-800") + " cursor-not-allowed opacity-75";
                    drawClass = baseBtn + (myBet === 'DRAW' ? "bg-amber-900/50 text-amber-300 border-amber-800" : "bg-zinc-900 text-zinc-600 border-zinc-800") + " cursor-not-allowed opacity-75";
                    awayClass = baseBtn + (myBet === 'AWAY' ? "bg-emerald-900/50 text-emerald-300 border-emerald-800" : "bg-zinc-900 text-zinc-600 border-zinc-800") + " cursor-not-allowed opacity-75";
                }

                let scoreBadgeClass = isLive 
                    ? "text-base font-black text-red-400 px-3 py-1 bg-red-950/40 rounded-lg border border-red-500/40 whitespace-nowrap cursor-pointer hover:bg-red-900/50 transition"
                    : "text-base font-black text-blue-400 px-3 py-1 bg-zinc-950 rounded-lg border border-zinc-800 whitespace-nowrap cursor-pointer hover:bg-zinc-800 transition";

                let card = existingCardsMap.get(match.id);
                if (!card) {
                    card = document.createElement('div');
                    card.dataset.matchId = match.id;
                }
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-xl space-y-4";

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-2.5">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center text-right w-2/3 truncate justify-end"><i class="fa-solid fa-trophy text-blue-400 mr-1.5"></i>${match.competition.name}</span>
                    </div>
                    
                    <div class="flex justify-between items-center px-1 gap-2">
                        <div class="flex items-center space-x-2.5 w-2/5 overflow-hidden">
                            <img src="${homeLogo}" class="w-8 h-8 object-contain flex-shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=H&background=18181b&color=60a5fa'">
                            <span class="text-xs font-black text-white truncate">${homeName}</span>
                        </div>
                        <span onclick="editScoreManual('${match.id}', '${homeName}', '${awayName}')" title="Cliquer pour corriger le score manuellement" class="${scoreBadgeClass}">${sHome} - ${sAway} <i class="fa-solid fa-pen text-[10px] ml-1 opacity-60"></i></span>
                        <div class="flex items-center justify-end space-x-2.5 w-2/5 overflow-hidden">
                            <span class="text-xs font-black text-white truncate text-right">${awayName}</span>
                            <img src="${awayLogo}" class="w-8 h-8 object-contain flex-shrink-0" onerror="this.src='https://ui-avatars.com/api/?name=A&background=18181b&color=60a5fa'">
                        </div>
                    </div>

                    <div class="flex gap-2.5 pt-1">
                        <button ${isFinished ? 'disabled' : `onclick="placeBet('${match.id}', 'HOME')"`} class="${homeClass}">
                            <span class="text-[10px] uppercase font-bold tracking-wider mb-0.5 opacity-80">1</span>
                            <span class="truncate w-full text-[11px] leading-tight">${homeName}</span>
                            ${algoPrediction === 'HOME' ? badgeAlgo : ''}
                        </button>
                        <button ${isFinished ? 'disabled' : `onclick="placeBet('${match.id}', 'DRAW')"`} class="${drawClass}">
                            <span class="text-[10px] uppercase font-bold tracking-wider mb-0.5 opacity-80">N</span>
                            <span class="text-[11px] leading-tight">Nul</span>
                            ${algoPrediction === 'DRAW' ? badgeAlgo : ''}
                        </button>
                        <button ${isFinished ? 'disabled' : `onclick="placeBet('${match.id}', 'AWAY')"`} class="${awayClass}">
                            <span class="text-[10px] uppercase font-bold tracking-wider mb-0.5 opacity-80">2</span>
                            <span class="truncate w-full text-[11px] leading-tight">${awayName}</span>
                            ${algoPrediction === 'AWAY' ? badgeAlgo : ''}
                        </button>
                    </div>
                    
                    ${myBet ? `
                    <div class="flex justify-between items-center text-[11px] bg-zinc-950 rounded-xl px-3.5 py-2.5 border border-zinc-800 mt-2">
                        <span class="text-zinc-400">Mise engagée : <strong class="text-blue-400">${currentStake.toFixed(2)} €</strong></span>
                        <div>
                            ${isFinished 
                                ? (myBet === winner ? '<span class="text-emerald-400 font-bold"><i class="fa-solid fa-check"></i> Gagné</span>' : '<span class="text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Perdu</span>') 
                                : (isLive 
                                    ? `<span class="text-amber-400 font-bold">En cours (${sHome}-${sAway})</span>`
                                    : '<span class="text-blue-400 font-medium">Pari validé (En attente)</span>')
                            }
                        </div>
                    </div>` : ''}
                `;
                newContainerContent.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(newContainerContent);
        }

        function editScoreManual(matchId, homeName, awayName) {
            let currentMatch = currentMatches.find(m => m.id === matchId);
            let defH = currentMatch ? currentMatch.homeTeam.numScore : 0;
            let defA = currentMatch ? currentMatch.awayTeam.numScore : 0;

            let inputH = prompt(`Score pour ${homeName} :`, defH);
            if (inputH === null) return;
            let inputA = prompt(`Score pour ${awayName} :`, defA);
            if (inputA === null) return;

            let hScore = parseInt(inputH, 10);
            let aScore = parseInt(inputA, 10);

            if (isNaN(hScore) || isNaN(aScore)) {
                showToast("Veuillez entrer des chiffres valides.", "error");
                return;
            }

            const dateStr = document.getElementById('matchDate').value;
            let manualScores = JSON.parse(localStorage.getItem(`foot_manual_scores_${dateStr}`)) || {};
            manualScores[matchId] = { home: hScore, away: aScore };
            localStorage.setItem(`foot_manual_scores_${dateStr}`, JSON.stringify(manualScores));

            showToast("Score mis à jour manuellement avec succès !", "success");
            loadFootballMatches(true);
        }

        function placeBet(matchId, pick) {
            let match = currentMatches.find(m => m.id === matchId);
            if (match && match.status === 'FINISHED') {
                showToast("Ce match est terminé, les paris sont clos.", "error");
                return;
            }

            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`footbet_pro_v3_${dateStr}`)) || {};
            if (savedBets[matchId] === pick) {
                delete savedBets[matchId];
                showToast("Pari annulé");
            } else {
                savedBets[matchId] = pick;
                showToast("Pari validé", "success");
            }
            localStorage.setItem(`footbet_pro_v3_${dateStr}`, JSON.stringify(savedBets));
            applyFilters();
            calculateDailyBankroll();
        }

        function calculateDailyBankroll() {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`footbet_pro_v3_${dateStr}`)) || {};
            
            let dailyProfit = 0; 
            let betsCount = 0; 
            let totalStake = 0;
            let currentBankroll = INITIAL_BANKROLL;

            currentMatches.forEach(match => {
                let myBet = savedBets[match.id];
                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);
                    totalStake += currentStake;

                    if (match.status === 'FINISHED' && match.winner) {
                        if (myBet === match.winner) {
                            let netWin = (1.80 * currentStake) - currentStake;
                            dailyProfit += netWin;
                            currentBankroll += netWin;
                        } else {
                            dailyProfit -= currentStake;
                            currentBankroll -= currentStake;
                        }
                    }
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            document.getElementById('dailyTotalStake').textContent = `${totalStake.toFixed(2)} €`;

            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-emerald-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;
            document.getElementById('headerBankroll').textContent = `${(INITIAL_BANKROLL + dailyProfit).toFixed(2)} €`;

            if (betsCount > 0 || dailyProfit !== 0 || (savedBets && Object.keys(savedBets).length > 0)) {
                let history = JSON.parse(localStorage.getItem('footbet_pro_v3_full_history')) || {};
                history[dateStr] = dailyProfit;
                localStorage.setItem('footbet_pro_v3_full_history', JSON.stringify(history));
            }

            if (!document.getElementById('historyBlock').classList.contains('hidden')) {
                showHistoryStats();
            }
        }

        function showHistoryStats() {
            let dateInput = document.getElementById('matchDate').value;
            let currentViewDate = dateInput ? new Date(dateInput) : new Date();
            let year = currentViewDate.getFullYear();
            
            document.getElementById('currentYearText').textContent = year;
            let history = JSON.parse(localStorage.getItem('footbet_pro_v3_full_history')) || {};

            let dayOfWeek = currentViewDate.getDay() || 7; 
            let monday = new Date(currentViewDate);
            monday.setDate(currentViewDate.getDate() - (dayOfWeek - 1)); 
            
            let wTotal = 0;
            for (let i = 0; i < 7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                let yr = d.getFullYear();
                let mo = String(d.getMonth() + 1).padStart(2, '0');
                let da = String(d.getDate()).padStart(2, '0');
                let dStr = `${yr}-${mo}-${da}`;
                wTotal += history[dStr] || 0;
            }

            let wpEl = document.getElementById('weekTotal');
            wpEl.textContent = `${wTotal > 0 ? '+' : ''}${wTotal.toFixed(2)} €`;
            wpEl.className = wTotal > 0 ? 'text-blue-400 font-black' : (wTotal < 0 ? 'text-red-400 font-black' : 'text-zinc-400 font-black');

            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
            let monthsGrid = document.getElementById('monthsGrid');
            monthsGrid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                let mTot = 0;
                let hasData = false;
                let daysInMonth = new Date(year, m + 1, 0).getDate(); 
                
                for (let d = 1; d <= daysInMonth; d++) {
                    let mm = String(m + 1).padStart(2, '0');
                    let dd = String(d).padStart(2, '0');
                    let dStr = `${year}-${mm}-${dd}`;
                    if (history[dStr] !== undefined) {
                        hasData = true;
                        mTot += history[dStr] || 0;
                    }
                }

                if (hasData) {
                    let div = document.createElement('div');
                    let isCurrentMonth = (m === currentViewDate.getMonth());
                    div.className = isCurrentMonth 
                        ? "bg-zinc-800 p-3 rounded-xl border border-blue-500/50 mb-2 flex justify-between items-center text-xs" 
                        : "bg-zinc-800/50 p-3 rounded-xl border border-zinc-700/50 mb-2 flex justify-between items-center text-xs";

                    let totColor = mTot >= 0 ? 'text-blue-400' : 'text-red-400';
                    div.innerHTML = `
                        <span class="font-bold ${isCurrentMonth ? 'text-white' : 'text-zinc-300'}">${monthNames[m]}</span>
                        <span class="font-black ${totColor}">${mTot > 0 ? '+' : ''}${mTot.toFixed(2)} €</span>
                    `;
                    monthsGrid.appendChild(div);
                }
            }

            if (monthsGrid.innerHTML === '') {
                monthsGrid.innerHTML = '<div class="text-zinc-500 text-center text-xs py-2">Naviguez sur une date pour enregistrer les bilans.</div>';
            }
        }

        window.onload = () => loadFootballMatches(false);
    </script>
</body>
</html>
