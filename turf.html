<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurfBet Pro - PMU Vrais Rapports</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TurfBet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-emerald-400 flex items-center">
                <i class="fa-solid fa-horse-head mr-2"></i>TurfBet Pro
            </h1>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-emerald-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-emerald-400" onchange="loadTurfRaces()">
                <!-- BOUTON GAINS DU MOIS / HISTORIQUE RÉTABLI -->
                <button onclick="toggleHistoryStats()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 font-bold transition flex items-center shadow relative" title="Gains du mois">
                    <i class="fa-solid fa-calendar-days text-emerald-400"></i>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-fire mr-1.5"></i> À venir / Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-emerald-400 flex-grow">
                <option value="ALL">Toutes les réunions</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-emerald-400 font-mono flex items-center w-3/4 truncate">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Connexion rapide au PMU...
            </div>
            <button onclick="loadTurfRaces(false)" class="bg-zinc-800 hover:bg-zinc-700 text-emerald-400 px-3 py-1.5 rounded-lg border border-emerald-500/30 text-xs font-bold transition flex items-center shadow">
                <i class="fa-solid fa-rotate mr-1.5"></i> Actualiser
            </button>
        </div>

        <!-- PANNEAU DES GAINS CUMULÉS (SEMAINE & MOIS PAR MOIS) -->
        <div id="historyBlock" class="hidden bg-zinc-900 border border-emerald-500/30 rounded-2xl p-4 shadow-xl mb-2">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold uppercase text-zinc-300 tracking-wider flex items-center">
                    <i class="fa-solid fa-vault mr-1.5 text-emerald-400"></i> Vos Gains Cumulés PMU
                </h2>
                <button onclick="toggleHistoryStats()" class="text-zinc-500 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4 max-h-96 overflow-y-auto pr-1">
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Semaine en cours</h3>
                    <div class="flex justify-between text-xs font-bold">
                        <span class="text-zinc-400">Bénéfice Net :</span>
                        <span id="weekProfit" class="text-emerald-400">-- €</span>
                    </div>
                </div>
                <div class="bg-zinc-800/80 p-3 rounded-xl border border-zinc-700">
                    <h3 class="text-[11px] uppercase font-bold text-zinc-300 mb-2">Mois par Mois (<span id="currentYearText"></span>)</h3>
                    <div id="monthsGrid" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-emerald-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-emerald-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-zinc-400 uppercase">Courses pariées</div>
                <div id="dailyBetsCount" class="text-sm font-bold text-zinc-300">0</div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between items-center text-xs text-zinc-300 shadow-md">
            <span><i class="fa-solid fa-wallet mr-1.5 text-emerald-400"></i> Total Mises du jour (PMU) :</span>
            <span id="totalSpentText" class="font-bold text-white">0.00 €</span>
        </div>

        <div id="matchesContainer" class="space-y-3"></div>

    </main>

    <script>
        const now = new Date();
        const localDateStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        document.getElementById('matchDate').value = localDateStr;

        let currentRaces = [];
        let fetchedRapports = {}; 
        let isLiveFilterActive = false;
        
        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02; 

        setInterval(() => {
            if (document.getElementById('matchDate').value === localDateStr || isLiveFilterActive) {
                loadTurfRaces(true);
            }
        }, 30000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-emerald-900/90 border-emerald-500/50 text-emerald-200' : 'bg-zinc-800 border-zinc-700 text-white';
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // CONNEXION ULTRA-RAPIDE EN PARALLÈLE (Le 1er serveur qui répond gagne)
        async function fetchPMUData(endpoint) {
            const urls = [
                `https://online.turfinfo.api.pmu.fr/rest/client/61/${endpoint}`,
                `https://online.turfinfo.api.pmu.fr/rest/client/1/${endpoint}`,
                `https://offline.pmu.fr/api/client/1/${endpoint}`
            ];

            const fetchAttempt = async (fullUrl) => {
                const res = await fetch(fullUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error("Status " + res.status);
                const text = await res.text();
                // Si c'est AllOrigins /get, le JSON est dans .contents
                try {
                    const parsed = JSON.parse(text);
                    if (parsed && parsed.contents) return JSON.parse(parsed.contents);
                    return parsed;
                } catch (e) {
                    throw new Error("Invalid JSON");
                }
            };

            // On lance toutes les méthodes en parallèle pour éviter tout blocage
            const promises = [
                fetchAttempt(urls[0]),
                fetchAttempt(`https://corsproxy.io/?${encodeURIComponent(urls[0])}`),
                fetchAttempt(`https://api.allorigins.win/raw?url=${encodeURIComponent(urls[0])}`),
                fetchAttempt(`https://api.allorigins.win/get?url=${encodeURIComponent(urls[0])}`),
                fetchAttempt(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urls[1])}`)
            ];

            return await Promise.any(promises);
        }

        // Récupère les VRAIS rapports officiels (Sans fausse cote de secours)
        async function fetchExactRapport(apiDate, R, C) {
            const cacheKey = `${apiDate}_R${R}C${C}`;
            if (fetchedRapports[cacheKey]) return fetchedRapports[cacheKey];

            try {
                let data = await fetchPMUData(`programme/${apiDate}/R${R}/C${C}/rapports-definitifs?specialisation=INTERNET`);
                let rapportSG = null;

                if (Array.isArray(data)) {
                    // Priorité au rapport Simple Gagnant officiel
                    const sgTypes = ['E_SIMPLE_GAGNANT', 'SIMPLE_GAGNANT', 'E_SG', 'SG'];
                    for (let typePari of data) {
                        if (sgTypes.includes(typePari.typePari) && typePari.rapports && typePari.rapports.length > 0) {
                            rapportSG = {};
                            typePari.rapports.forEach(r => {
                                // Gère les formats [5] ou "5"
                                let chevalNum = Array.isArray(r.combinaisons) ? parseInt(r.combinaisons[0]) : parseInt(r.combinaisons);
                                let div = r.dividendePourUnEuro ? (r.dividendePourUnEuro / 100) : (r.dividende / 100);
                                if (!isNaN(chevalNum) && div > 0) {
                                    rapportSG[chevalNum] = div;
                                }
                            });
                            if (Object.keys(rapportSG).length > 0) break;
                        }
                    }
                }

                if (rapportSG && Object.keys(rapportSG).length > 0) {
                    fetchedRapports[cacheKey] = rapportSG;
                    return rapportSG;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        async function loadTurfRaces(isSilent = false) {
            const dateStr = document.getElementById('matchDate').value;
            const [yyyy, mm, dd] = dateStr.split('-');
            const apiDateCorrected = `${dd}${mm}${yyyy}`; // Format DDMMYYYY exigé par PMU
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Synchronisation avec les serveurs PMU...';
                document.getElementById('matchesContainer').innerHTML = '';
            }
            
            try {
                let data = await fetchPMUData(`programme/${apiDateCorrected}?meteo=true&specialisation=INTERNET`);
                
                let validRaces = [];
                let fetchRapportsPromises = [];
                let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};

                if (data && data.programme && data.programme.reunions) {
                    data.programme.reunions.forEach(reunion => {
                        let reunionName = reunion.hippodrome?.libelleCourt || reunion.libelleLong || `Réunion ${reunion.numOfficiel}`;
                        let pays = reunion.pays?.code || "FRA";
                        let R = reunion.numOfficiel;

                        (reunion.courses || []).forEach(course => {
                            let C = course.numOfficiel;
                            let courseId = `R${R}C${C}`;
                            
                            let statutRaw = course.statut || "";
                            let isTerminee = (statutRaw === 'ARRIVEE_DEFINITIVE_COMPLETE' || statutRaw === 'ARRIVEE' || statutRaw === 'TERMINEE' || statutRaw === 'FIN_COURSE' || (course.ordreArrivee && course.ordreArrivee.length > 0));
                            let isLive = !isTerminee && (statutRaw === 'EN_COURS' || statutRaw === 'DEPART_IMMINENT' || (course.heureDepart <= Date.now() && Date.now() - course.heureDepart < 1200000));
                            let status = isLive ? 'IN_PLAY' : (isTerminee ? 'FINISHED' : 'TIMED');

                            let gagnantsArrivee = [];
                            if (course.ordreArrivee && Array.isArray(course.ordreArrivee)) {
                                gagnantsArrivee = course.ordreArrivee.map(arr => Array.isArray(arr) ? parseInt(arr[0]) : parseInt(arr));
                            }

                            validRaces.push({
                                id: courseId,
                                r: R,
                                c: C,
                                pays: pays,
                                status: status,
                                utcDate: course.heureDepart,
                                competition: { name: `R${R} - ${reunionName}` },
                                raceName: `C${C} - ${course.libelleCourt || course.libelle}`,
                                distance: `${course.distance || ''}m`,
                                partants: course.nombreDeclaresPartants || '?',
                                gagnants: gagnantsArrivee
                            });

                            // Si la course est terminée et qu'on a parié dessus, on récupère les VRAIS rapports PMU
                            if (savedBets[courseId] && isTerminee) {
                                fetchRapportsPromises.push(fetchExactRapport(apiDateCorrected, R, C));
                            }
                        });
                    });
                }

                await Promise.all(fetchRapportsPromises);

                validRaces.sort((a, b) => a.utcDate - b.utcDate);
                currentRaces = validRaces;

                if (currentRaces.length === 0) {
                    statusText.innerHTML = `<span class="text-zinc-400"><i class="fa-solid fa-calendar-xmark mr-1"></i> Aucune course PMU programmée à cette date.</span>`;
                } else {
                    if (!isSilent) {
                        statusText.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentRaces.length} courses PMU chargées</span>`;
                    }
                }
                
                populateCompetitions(currentRaces);
                applyFilters();
                calculateDailyBankroll(apiDateCorrected);

            } catch (error) {
                console.error("Erreur PMU:", error);
                statusText.innerHTML = `<span class="text-red-400 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Serveur PMU momentanément occupé. Cliquez sur Actualiser.</span>`;
            }
        }

        function populateCompetitions(races) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            select.innerHTML = '<option value="ALL">Toutes les réunions (' + races.length + ' courses)</option>';
            
            const compsMap = new Map();
            races.forEach(r => {
                if (r.competition?.name) {
                    compsMap.set(r.competition.name, (compsMap.get(r.competition.name) || 0) + 1);
                }
            });
            
            Array.from(compsMap.keys()).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `${c} (${compsMap.get(c)} c.)`;
                select.appendChild(opt);
            });
            
            if (Array.from(compsMap.keys()).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if (isLiveFilterActive) {
                btn.classList.replace('bg-red-900/40', 'bg-red-600');
                btn.classList.replace('text-red-400', 'text-white');
            } else {
                btn.classList.replace('bg-red-600', 'bg-red-900/40');
                btn.classList.replace('text-white', 'text-red-400');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentRaces;
            if (isLiveFilterActive) {
                filtered = filtered.filter(r => r.status === 'IN_PLAY' || r.status === 'TIMED');
            }
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(r => r.competition?.name === selectedComp);
            renderMatches(filtered);
        }

        async function promptBet(courseId, r, c) {
            const dateStr = document.getElementById('matchDate').value;
            const [yyyy, mm, dd] = dateStr.split('-');
            const apiDateCorrected = `${dd}${mm}${yyyy}`;
            let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};
            
            if (savedBets[courseId]) {
                delete savedBets[courseId];
                localStorage.setItem(`turfbet_${dateStr}`, JSON.stringify(savedBets));
                showToast("Pari annulé");
                applyFilters();
                calculateDailyBankroll(apiDateCorrected);
                return;
            }

            let numCheval = prompt(`Entrez le N° du cheval Gagnant pour ${courseId} :`);
            if (numCheval && !isNaN(numCheval) && parseInt(numCheval) > 0) {
                savedBets[courseId] = parseInt(numCheval);
                localStorage.setItem(`turfbet_${dateStr}`, JSON.stringify(savedBets));
                showToast(`Cheval N°${parseInt(numCheval)} validé sur ${courseId}`, "success");
                
                // Si la course est déjà finie, on va tout de suite chercher le vrai rapport officiel
                await fetchExactRapport(apiDateCorrected, r, c);
                applyFilters();
                calculateDailyBankroll(apiDateCorrected);
            }
        }

        function renderMatches(racesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            const [yyyy, mm, dd] = dateStr.split('-');
            const apiDateCorrected = `${dd}${mm}${yyyy}`;
            let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};

            container.innerHTML = '';

            if (racesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucune course PMU pour ce filtre.</div>`;
                return;
            }

            racesToRender.forEach(race => {
                let isFinished = race.status === 'FINISHED';
                let isLive = race.status === 'IN_PLAY';
                let timeStr = new Date(race.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

                const cacheKey = `${apiDateCorrected}_R${race.r}C${race.c}`;
                let vraisRapports = fetchedRapports[cacheKey];

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${timeStr}</span>`;
                if (isLive) statusBadge = `<span class="bg-red-900/60 text-red-300 border border-red-500/40 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold animate-pulse">🔴 En piste</span>`;
                if (isFinished) {
                    let arriveeTxt = race.gagnants.length > 0 ? `Arrivée : ${race.gagnants.slice(0,3).join(' - ')}` : 'Terminée';
                    statusBadge = `<span class="bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${arriveeTxt}</span>`;
                }

                let myBet = savedBets[race.id]; 
                let betMessage = '';
                
                if (myBet) {
                    if (isFinished) {
                        // VÉRIFICATION STRICTE : Les vrais rapports PMU sont-ils publiés ?
                        if (vraisRapports && Object.keys(vraisRapports).length > 0) {
                            if (race.gagnants[0] === myBet || vraisRapports[myBet]) {
                                let coteReelle = vraisRapports[myBet];
                                betMessage = `<div class="mt-3 text-center text-[11px] bg-zinc-950 rounded py-1.5 border border-emerald-800 text-emerald-400 font-bold"><i class="fa-solid fa-check mr-1"></i> Gagné ! Vrai rapport PMU : ${coteReelle.toFixed(2)} / 1</div>`;
                            } else {
                                betMessage = `<div class="mt-3 text-center text-[11px] bg-zinc-950 rounded py-1.5 border border-red-800 text-red-400 font-bold"><i class="fa-solid fa-xmark mr-1"></i> Perdu (Gagnant : N°${race.gagnants[0] || '?'})</div>`;
                            }
                        } else {
                            // Course étrangère (Chili, etc.) dont le PMU n'a pas encore publié les rapports définitifs
                            betMessage = `<div class="mt-3 text-center text-[11px] bg-zinc-950 rounded py-1.5 border border-amber-700/60 text-amber-400 font-bold"><i class="fa-solid fa-hourglass-half mr-1"></i> En attente des vrais rapports officiels PMU...</div>`;
                        }
                    } else {
                        betMessage = `<div class="mt-3 text-center text-[11px] bg-zinc-950 rounded py-1.5 border border-zinc-800 text-emerald-400 font-bold">Cheval N°${myBet} engagé (Mise dynamique 2%)</div>`;
                    }
                }

                let card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-md";

                let btnClass = myBet 
                    ? "w-full py-2.5 rounded-xl text-xs font-black transition bg-emerald-600/40 border border-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.3)] text-white" 
                    : "w-full py-2.5 rounded-xl text-xs font-black transition bg-zinc-800/70 border border-zinc-700 hover:bg-zinc-800 text-emerald-400";
                
                let btnText = myBet ? `Cheval N°${myBet} sélectionné (Cliquer pour annuler)` : `Choisir un cheval sur ${race.id}`;

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800/50 pb-2 mb-2">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center text-right w-2/3 truncate justify-end"><i class="fa-solid fa-horse-head text-emerald-400 mr-1.5"></i>${race.competition.name}</span>
                    </div>
                    
                    <div class="mb-3 flex justify-between items-center px-1">
                        <span class="text-xs sm:text-sm font-black text-white truncate">${race.raceName}</span>
                        <span class="text-[10px] text-zinc-400 font-mono whitespace-nowrap ml-2">${race.distance} • ${race.partants} part.</span>
                    </div>

                    <button onclick="promptBet('${race.id}', ${race.r}, ${race.c})" class="${btnClass}">${btnText}</button>
                    
                    ${betMessage}
                `;
                container.appendChild(card);
            });
        }

        function calculateDailyBankroll(apiDateCorrected) {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};
            
            if (!apiDateCorrected) {
                const [yyyy, mm, dd] = dateStr.split('-');
                apiDateCorrected = `${dd}${mm}${yyyy}`;
            }
            
            let dailyProfit = 0;
            let betsCount = 0;
            let totalSpent = 0;
            let currentBankroll = INITIAL_BANKROLL;

            currentRaces.forEach(race => {
                let myBet = savedBets[race.id];
                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);
                    totalSpent += currentStake;

                    if (race.status === 'FINISHED') {
                        const cacheKey = `${apiDateCorrected}_R${race.r}C${race.c}`;
                        let vraisRapports = fetchedRapports[cacheKey];

                        // AUCUNE FAUSSE COTE DE 15/1 : on ne calcule que si les vrais rapports PMU sont publiés
                        if (vraisRapports && Object.keys(vraisRapports).length > 0) {
                            let netRace = 0;
                            if (race.gagnants[0] === myBet || vraisRapports[myBet]) {
                                let coteReelle = vraisRapports[myBet];
                                netRace = (coteReelle * currentStake) - currentStake;
                                dailyProfit += netRace;
                            } else {
                                netRace = -currentStake;
                                dailyProfit -= currentStake;
                            }
                            currentBankroll += netRace;
                        }
                    }
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-emerald-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;

            document.getElementById('totalSpentText').textContent = `${totalSpent.toFixed(2)} €`;
            document.getElementById('headerBankroll').textContent = `${currentBankroll.toFixed(2)} €`;

            // Sauvegarde automatique dans l'historique du mois (y compris quand tu reviens sur les jours précédents)
            let globalStats = JSON.parse(localStorage.getItem('turfbet_history')) || {};
            globalStats[dateStr] = dailyProfit;
            localStorage.setItem('turfbet_history', JSON.stringify(globalStats));

            if (!document.getElementById('historyBlock').classList.contains('hidden')) {
                showHistoryStats();
            }
        }

        function toggleHistoryStats() {
            let block = document.getElementById('historyBlock');
            if (block.classList.contains('hidden')) {
                block.classList.remove('hidden');
                showHistoryStats();
            } else {
                block.classList.add('hidden');
            }
        }

        function showHistoryStats() {
            let dateInput = document.getElementById('matchDate').value;
            let currentViewDate = dateInput ? new Date(dateInput) : new Date();
            let year = currentViewDate.getFullYear();
            
            document.getElementById('currentYearText').textContent = year;
            let globalStats = JSON.parse(localStorage.getItem('turfbet_history')) || {};

            let dayOfWeek = currentViewDate.getDay() || 7; 
            let monday = new Date(currentViewDate);
            monday.setDate(currentViewDate.getDate() - (dayOfWeek - 1)); 
            
            let weekProfit = 0;
            for (let i = 0; i < 7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                let dStr = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                weekProfit += globalStats[dStr] || 0;
            }
            
            let wpEl = document.getElementById('weekProfit');
            wpEl.textContent = `${weekProfit > 0 ? '+' : ''}${weekProfit.toFixed(2)} €`;
            wpEl.className = weekProfit > 0 ? 'text-emerald-400 font-bold' : (weekProfit < 0 ? 'text-red-400 font-bold' : 'text-zinc-500');

            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
            let monthsGrid = document.getElementById('monthsGrid');
            monthsGrid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                let mProfit = 0;
                let daysInMonth = new Date(year, m + 1, 0).getDate(); 
                
                for (let d = 1; d <= daysInMonth; d++) {
                    let mm = String(m + 1).padStart(2, '0');
                    let dd = String(d).padStart(2, '0');
                    let dStr = `${year}-${mm}-${dd}`;
                    mProfit += globalStats[dStr] || 0;
                }

                if (mProfit !== 0) {
                    let div = document.createElement('div');
                    let isCurrentViewMonth = (m === currentViewDate.getMonth());
                    div.className = isCurrentViewMonth 
                        ? "bg-zinc-800 p-3 rounded-xl border border-emerald-500/50 mb-2 flex justify-between items-center" 
                        : "bg-zinc-800/50 p-3 rounded-xl border border-zinc-700/50 mb-2 flex justify-between items-center";

                    let colorCls = mProfit > 0 ? 'text-emerald-400' : 'text-red-400';
                    div.innerHTML = `
                        <span class="font-bold text-sm ${isCurrentViewMonth ? 'text-emerald-400' : 'text-zinc-300'}">${monthNames[m]}</span>
                        <span class="font-black ${colorCls}">${mProfit > 0 ? '+' : ''}${mProfit.toFixed(2)} €</span>
                    `;
                    monthsGrid.appendChild(div);
                }
            }
            if (monthsGrid.innerHTML === '') {
                monthsGrid.innerHTML = '<div class="text-zinc-500 text-center text-xs py-2">Aucune donnée Turf enregistrée pour cette année.</div>';
            }
        }

        window.onload = loadTurfRaces;
    </script>
</body>
</html>
