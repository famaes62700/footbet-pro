<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurfBet Pro - PMU Vrais Rapports</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-10">

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Navigation inter-applis -->
    <nav class="bg-zinc-900 border-b border-zinc-800 p-2 flex justify-center gap-4 text-xs font-bold">
        <a href="foot.html" class="text-zinc-500 hover:text-white transition"><i class="fa-solid fa-futbol mr-1"></i> Foot</a>
        <a href="nba.html" class="text-zinc-500 hover:text-white transition"><i class="fa-solid fa-basketball mr-1"></i> NBA</a>
        <a href="tennis.html" class="text-zinc-500 hover:text-white transition"><i class="fa-solid fa-table-tennis-paddle-ball mr-1"></i> Tennis</a>
        <a href="pmu.html" class="text-emerald-400 border-b-2 border-emerald-400 pb-1"><i class="fa-solid fa-horse-head mr-1"></i> Turf</a>
    </nav>

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-between items-center mb-3">
            <h1 class="text-base sm:text-lg font-black tracking-wider text-emerald-400 flex items-center">
                <i class="fa-solid fa-horse-head mr-2"></i>TurfBet Pro
            </h1>
            <div class="flex items-center space-x-3">
                <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700 text-emerald-400 font-bold">
                    Bankroll: <span id="headerBankroll">100.00 €</span>
                </div>
                <input type="date" id="matchDate" class="bg-zinc-800 text-white text-xs px-2 py-1.5 rounded-lg border border-zinc-700 cursor-pointer focus:outline-none focus:border-emerald-400" onchange="loadTurfRaces()">
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button id="btnFilterLive" onclick="toggleLiveFilter()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-clock mr-1.5"></i> À venir / Direct
            </button>
            <select id="compSelect" onchange="applyFilters()" class="bg-zinc-800 text-white text-xs px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:border-emerald-400 flex-grow">
                <option value="ALL">Toutes les réunions</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 space-y-4">
        
        <div class="flex justify-between items-center">
            <div id="statusText" class="text-xs text-emerald-400 font-mono flex items-center w-3/4 truncate">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Connexion au PMU...
            </div>
            <button onclick="loadTurfRaces(false)" class="bg-zinc-800 hover:bg-zinc-700 text-emerald-400 px-3 py-1.5 rounded-lg border border-emerald-500/30 text-xs font-bold transition flex items-center shadow">
                <i class="fa-solid fa-rotate mr-1.5"></i> Actualiser
            </button>
        </div>

        <div class="bg-zinc-900 border border-emerald-500/30 rounded-2xl p-4 shadow-xl mb-2 flex justify-between items-center">
            <div>
                <h2 class="text-xs font-bold uppercase text-emerald-400 tracking-wider mb-1">Bilan du Jour</h2>
                <div id="dailyProfit" class="text-lg font-black text-white">0.00 €</div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-zinc-400 uppercase">Courses pariées</div>
                <div id="dailyBetsCount" class="text-sm font-bold text-zinc-300">0</div>
            </div>
        </div>

        <div id="matchesContainer" class="space-y-3"></div>

    </main>

    <script>
        const now = new Date();
        const localDateStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        document.getElementById('matchDate').value = localDateStr;

        let currentRaces = [];
        let fetchedRapports = {}; 
        let isLiveFilterActive = false;
        
        const INITIAL_BANKROLL = 100.0;
        const STAKE_PERCENT = 0.02; 

        setInterval(() => {
            if (document.getElementById('matchDate').value === localDateStr || isLiveFilterActive) {
                loadTurfRaces(true);
            }
        }, 30000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-emerald-900/90 border-emerald-500/50 text-emerald-200' : 'bg-zinc-800 border-zinc-700 text-white';
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-bold transition transform duration-300 opacity-0 translate-y-2 mb-2 flex items-center ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function fetchExactRapport(apiDate, R, C) {
            const cacheKey = `${apiDate}_R${R}C${C}`;
            if (fetchedRapports[cacheKey]) return fetchedRapports[cacheKey];

            try {
                let res = await fetch(`https://offline.pmu.fr/api/client/1/programme/${apiDate}/R${R}/C${C}/rapports-definitifs?specialisation=INTERNET`);
                if (!res.ok) return null; // API pas prête (Chili en attente, etc.)
                
                let data = await res.json();
                let rapportE_SG = null;

                // On cherche le rapport Simple Gagnant (e-SG ou SG)
                data.forEach(typePari => {
                    if (typePari.typePari === 'E_SG' || typePari.typePari === 'SG') {
                        if (typePari.rapports && typePari.rapports.length > 0) {
                            // On stocke le mapping { "numeroCheval": dividende }
                            rapportE_SG = {};
                            typePari.rapports.forEach(r => {
                                // r.combinaisons contient souvent [3] (le cheval 3)
                                let chevalGagnant = r.combinaisons[0]; 
                                rapportE_SG[chevalGagnant] = r.dividende / 100; // PMU donne le dividende pour 100 centimes (soit 1€)
                            });
                        }
                    }
                });

                fetchedRapports[cacheKey] = rapportE_SG;
                return rapportE_SG;
            } catch (e) {
                return null;
            }
        }

        async function loadTurfRaces(isSilent = false) {
            const dateStr = document.getElementById('matchDate').value;
            const apiDate = dateStr.replace(/-/g, ''); // Format DDMMYYYY attendu par PMU : ex 03112026
            const apiDateCorrected = `${dateStr.split('-')[2]}${dateStr.split('-')[1]}${dateStr.split('-')[0]}`; 
            
            const statusText = document.getElementById('statusText');
            
            if (!isSilent) {
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Récupération du programme officiel PMU...';
                document.getElementById('matchesContainer').innerHTML = '';
            }
            
            try {
                const url = `https://offline.pmu.fr/api/client/1/programme/${apiDateCorrected}`;
                let res = await fetch(url);
                if (!res.ok) throw new Error("Programme introuvable");
                
                let data = await res.json();
                let validRaces = [];
                let fetchRapportsPromises = [];
                let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};

                if (data.programme && data.programme.reunions) {
                    data.programme.reunions.forEach(reunion => {
                        let reunionName = reunion.hippodrome?.libelleCourt || reunion.nomOfficiel;
                        let R = reunion.numOfficiel;

                        reunion.courses.forEach(course => {
                            let C = course.numOfficiel;
                            let courseId = `R${R}C${C}`;
                            
                            let isLive = (course.statut === 'A_PARTIR' && course.heureDepart <= Date.now()) || course.statut === 'EN_COURS';
                            let isTerminee = (course.statut === 'ARRIVEE' || course.statut === 'TERMINEE');
                            let status = isLive ? 'IN_PLAY' : (isTerminee ? 'FINISHED' : 'TIMED');

                            // Extraction de l'arrivée si disponible
                            let gagnantsArrivee = [];
                            if (isTerminee && course.ordreArrivee) {
                                gagnantsArrivee = course.ordreArrivee.map(arr => arr[0]); // ex: [5, 2, 8]
                            }

                            validRaces.push({
                                id: courseId,
                                r: R,
                                c: C,
                                status: status,
                                utcDate: course.heureDepart,
                                competition: { name: `R${R} - ${reunionName}` },
                                raceName: `C${C} - ${course.libelleCourt || course.libelle}`,
                                gagnants: gagnantsArrivee,
                                isRapportsDispo: course.statut === 'TERMINEE' // TERMINEE = Rapports saisis par PMU
                            });

                            // Si on a parié sur cette course et qu'elle est en ARRIVEE/TERMINEE, on va chercher le vrai rapport en fond
                            if (savedBets[courseId] && isTerminee) {
                                fetchRapportsPromises.push(fetchExactRapport(apiDateCorrected, R, C));
                            }
                        });
                    });
                }

                // Attendre la récupération des vrais rapports pour les courses pariées
                await Promise.all(fetchRapportsPromises);

                validRaces.sort((a, b) => a.utcDate - b.utcDate);
                currentRaces = validRaces;

                if (currentRaces.length === 0) {
                    if (!isSilent) statusText.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-calendar-xmark mr-1"></i> Aucune course PMU ce jour</span>`;
                } else {
                    const liveCount = currentRaces.filter(r => r.status === 'IN_PLAY').length;
                    if (!isSilent) {
                        statusText.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-check mr-1"></i> ${currentRaces.length} courses chargées</span>`;
                    }
                }
                
                populateCompetitions(currentRaces);
                applyFilters();
                calculateDailyBankroll(apiDateCorrected);

            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span class="text-red-400 font-semibold">Erreur réseau PMU.</span>`;
            }
        }

        function populateCompetitions(races) {
            const select = document.getElementById('compSelect');
            const currentSelection = select.value;
            select.innerHTML = '<option value="ALL">Toutes les réunions</option>';
            
            const compsMap = new Map();
            races.forEach(r => {
                if (r.competition?.name) compsMap.set(r.competition.name, true);
            });
            
            Array.from(compsMap.keys()).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                select.appendChild(opt);
            });
            
            if (Array.from(compsMap.keys()).includes(currentSelection)) {
                select.value = currentSelection;
            }
        }

        function toggleLiveFilter() {
            isLiveFilterActive = !isLiveFilterActive;
            const btn = document.getElementById('btnFilterLive');
            if (isLiveFilterActive) {
                btn.classList.replace('bg-zinc-800', 'bg-emerald-600');
                btn.classList.replace('text-zinc-300', 'text-white');
                btn.classList.replace('border-zinc-700', 'border-emerald-500');
            } else {
                btn.classList.replace('bg-emerald-600', 'bg-zinc-800');
                btn.classList.replace('text-white', 'text-zinc-300');
                btn.classList.replace('border-emerald-500', 'border-zinc-700');
            }
            applyFilters();
        }

        function applyFilters() {
            let filtered = currentRaces;
            if (isLiveFilterActive) {
                filtered = filtered.filter(r => r.status === 'IN_PLAY' || r.status === 'TIMED');
            }
            const selectedComp = document.getElementById('compSelect').value;
            if (selectedComp !== "ALL") filtered = filtered.filter(r => r.competition?.name === selectedComp);
            renderMatches(filtered);
        }

        function promptBet(courseId) {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};
            
            if (savedBets[courseId]) {
                delete savedBets[courseId];
                localStorage.setItem(`turfbet_${dateStr}`, JSON.stringify(savedBets));
                showToast("Pari annulé");
                applyFilters();
                calculateDailyBankroll();
                return;
            }

            let numCheval = prompt("Entrez le numéro du cheval à jouer Gagnant :");
            if (numCheval && !isNaN(numCheval)) {
                savedBets[courseId] = parseInt(numCheval);
                localStorage.setItem(`turfbet_${dateStr}`, JSON.stringify(savedBets));
                showToast("Pari Turf validé", "success");
                applyFilters();
                calculateDailyBankroll();
            }
        }

        function renderMatches(racesToRender) {
            const container = document.getElementById('matchesContainer');
            const dateStr = document.getElementById('matchDate').value;
            const apiDateCorrected = `${dateStr.split('-')[2]}${dateStr.split('-')[1]}${dateStr.split('-')[0]}`;
            let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};

            container.innerHTML = '';

            if (racesToRender.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-6 text-sm border border-zinc-800 rounded-xl bg-zinc-900/50">Aucune course PMU pour ce filtre.</div>`;
                return;
            }

            racesToRender.forEach(race => {
                let isFinished = race.status === 'FINISHED';
                let isLive = race.status === 'IN_PLAY';
                let timeStr = new Date(race.utcDate).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

                let statusBadge = `<span class="bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded text-[10px] uppercase font-bold">${timeStr}</span>`;
                if (isLive) statusBadge = `<span class="bg-red-900/60 text-red-300 border border-red-500/40 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold animate-pulse">🔴 En piste</span>`;
                if (isFinished) statusBadge = `<span class="bg-zinc-800 text-zinc-500 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Arrivée provisoire</span>`;
                if (isFinished && race.isRapportsDispo) statusBadge = `<span class="bg-emerald-900/60 text-emerald-300 border border-emerald-500/40 px-2.5 py-0.5 rounded text-[10px] uppercase font-bold">Rapports Payés</span>`;

                let myBet = savedBets[race.id]; 
                let betMessage = '';
                
                if (myBet) {
                    if (isFinished) {
                        const cacheKey = `${apiDateCorrected}_R${race.r}C${race.c}`;
                        let vraisRapports = fetchedRapports[cacheKey];

                        if (vraisRapports) { // PMU a fourni les rapports finaux
                            if (race.gagnants[0] === myBet) { // Victoire
                                let coteReelle = vraisRapports[myBet] || 1.10;
                                betMessage = `<div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-emerald-800 text-emerald-400 font-bold"><i class="fa-solid fa-check"></i> Gagné (Rapport PMU : ${coteReelle.toFixed(2)}€)</div>`;
                            } else {
                                betMessage = `<div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-red-800 text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Perdu</div>`;
                            }
                        } else {
                            // Sécurité pour les courses étrangères ou en cours de calcul
                            betMessage = `<div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-amber-800 text-amber-400 font-bold"><i class="fa-solid fa-hourglass-half"></i> En attente des rapports officiels...</div>`;
                        }
                    } else {
                        betMessage = `<div class="mt-3 text-center text-[10px] bg-zinc-950 rounded py-1.5 border border-zinc-800 text-emerald-400">Pari sur le N°${myBet} enregistré</div>`;
                    }
                }

                let card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-md";

                let btnClass = myBet 
                    ? "w-full py-2 rounded-lg text-sm font-black transition bg-emerald-600/40 border border-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.3)] text-white" 
                    : "w-full py-2 rounded-lg text-sm font-black transition bg-zinc-800/50 border border-zinc-700/50 hover:bg-zinc-800 text-emerald-400";
                
                let btnText = myBet ? `Annuler Pari (Cheval N°${myBet})` : `Parier sur cette course`;

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-zinc-800/50 pb-2 mb-3">
                        ${statusBadge}
                        <span class="text-[10px] text-zinc-300 font-bold tracking-wider flex items-center text-right w-2/3 truncate justify-end"><i class="fa-solid fa-horse-head text-emerald-400 mr-1.5"></i>${race.competition.name}</span>
                    </div>
                    
                    <div class="mb-3 text-center">
                        <span class="text-sm font-black text-white">${race.raceName}</span>
                    </div>

                    <button onclick="promptBet('${race.id}')" class="${btnClass}">${btnText}</button>
                    
                    ${betMessage}
                `;
                container.appendChild(card);
            });
        }

        function calculateDailyBankroll(apiDateCorrected) {
            const dateStr = document.getElementById('matchDate').value;
            let savedBets = JSON.parse(localStorage.getItem(`turfbet_${dateStr}`)) || {};
            
            if (!apiDateCorrected) {
                apiDateCorrected = `${dateStr.split('-')[2]}${dateStr.split('-')[1]}${dateStr.split('-')[0]}`;
            }
            
            let dailyProfit = 0; let betsCount = 0; let currentBankroll = INITIAL_BANKROLL;

            currentRaces.forEach(race => {
                let myBet = savedBets[race.id];
                if (myBet) {
                    betsCount++;
                    let currentStake = Math.max(0.5, currentBankroll * STAKE_PERCENT);

                    if (race.status === 'FINISHED') {
                        const cacheKey = `${apiDateCorrected}_R${race.r}C${race.c}`;
                        let vraisRapports = fetchedRapports[cacheKey];

                        // ON NE TOUCHE À LA BANKROLL QUE SI LES RAPPORTS SONT PUBLIÉS (Sécurité Chili/Etranger)
                        if (vraisRapports) {
                            if (race.gagnants[0] === myBet) {
                                let coteReelle = vraisRapports[myBet] || 1.10;
                                dailyProfit += ((coteReelle * currentStake) - currentStake);
                            } else {
                                dailyProfit -= currentStake;
                            }
                        }
                    }
                    currentBankroll += dailyProfit;
                }
            });

            document.getElementById('dailyBetsCount').textContent = betsCount;
            let profitEl = document.getElementById('dailyProfit');
            profitEl.textContent = `${dailyProfit > 0 ? '+' : ''}${dailyProfit.toFixed(2)} €`;
            profitEl.className = `text-lg font-black ${dailyProfit > 0 ? 'text-emerald-400' : (dailyProfit < 0 ? 'text-red-400' : 'text-white')}`;
            document.getElementById('headerBankroll').textContent = `${(INITIAL_BANKROLL + dailyProfit).toFixed(2)} €`;
        }

        window.onload = loadTurfRaces;
    </script>
</body>
</html>
